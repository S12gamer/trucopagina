<!-- Candado de acceso -->
<div class="gate" id="gate" hidden>
  <div class="gate-box">
    <img class="gate-mark" src="icons/icon-192.png" alt="" width="84" height="84">
    <h1>Bóveda del Nodo</h1>
    <p>Área restringida: Jefatura, Subjefatura y los 10 titulares y suplentes.</p>
    <form id="gateForm">
      <label class="sr" for="gateCode">Código de acceso</label>
      <input id="gateCode" name="code" type="password" autocomplete="off" placeholder="Código de acceso" required>
      <p class="gate-err" id="gateErr" role="alert"></p>
      <button type="submit" class="btn primary" style="width:100%">Entrar</button>
    </form>
    <div class="gate-name" id="gateName" hidden>
      <form id="gateNameForm" style="display:grid;gap:10px">
        <label class="sr" for="gateNameInput">Tu nombre</label>
        <input id="gateNameInput" type="text" autocomplete="name" placeholder="¿Cómo te llamas?" required maxlength="40" style="text-align:left;font-family:var(--sans);font-size:16px;letter-spacing:normal">
        <label class="sr" for="gateRolInput">Tu rol en el Nodo</label>
        <select id="gateRolInput" required style="text-align:left;font-family:var(--sans);font-size:16px;letter-spacing:normal;min-height:48px;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--bg)">
          <option value="Titular" selected>Titular</option>
          <option value="Suplente">Suplente</option>
        </select>
        <p class="hint" style="text-align:left">Jefatura y Subjefatura los asigna aparte quien administra la Bóveda.</p>
        <button type="submit" class="btn primary" style="width:100%">Continuar</button>
      </form>
    </div>
  </div>
</div>

<!-- App -->
<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="rail-brand">
      <img src="icons/icon-192.png" alt="" width="44" height="44">
      <div><b>Bóveda del Nodo</b><small>Acceso nivel 1</small></div>
    </div>
    <nav class="rail-nav" id="rail-nav" aria-label="Secciones"></nav>
    <div class="rail-foot">
      <button type="button" class="rail-link" data-act="install" id="installRail" hidden><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg>Instalar la app</button>
      <button type="button" class="rail-link" data-act="signout"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg>Salir de la Bóveda</button>
      <div class="rail-plate"><b><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg>Área restringida</b>Jefatura, Subjefatura y los 10 titulares y suplentes.</div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="brand-m"><img src="icons/icon-192.png" alt="" width="30" height="30">Bóveda del Nodo</div>
      <div class="search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <label class="sr" for="q">Buscar en esta sección</label>
        <input id="q" type="search" autocomplete="off" placeholder="Buscar">
      </div>
      <button type="button" class="who" id="who" data-act="who" aria-label="Ver mi tarjeta">
        <span class="dot off" id="whoDot"></span>
        <span class="av" id="whoAv"></span>
        <span id="whoName"></span>
      </button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Secciones" hidden></nav>

<dialog id="dlg" aria-labelledby="dlgTitle"><div class="dlg" id="dlgBody"></div></dialog>
<dialog id="cfm" aria-labelledby="cfmTitle"><div class="dlg" id="cfmBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<datalist id="dl-materias"></datalist>

<script type="module" src="js/app.js"></script>
</body>
</html>
