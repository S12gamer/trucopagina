<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Synaps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%23C8893A%27/%3E%3Cpath d=%27M42 21c-2-4-6-6-11-6-6 0-10 3-10 8 0 11 21 5 21 17 0 5-5 8-11 8-6 0-10-2-12-6%27 fill=%27none%27 stroke=%27%231C1917%27 stroke-width=%276%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<style>
:root{
  --bg:#EDE8DF; --surface:#FAF8F4; --surface-2:#F4F0E8;
  --ink:#1C1917; --ink-m:#5C5751; --ink-faint:#9A9490;
  --sidebar:#1C1917;
  --amber:#C8893A; --amber-l:rgba(200,137,58,.14); --amber-glow:rgba(200,137,58,.22);
  --teal:#1B7A6E;   --teal-l:rgba(27,122,110,.12);
  --rust:#923A28;   --rust-l:rgba(146,58,40,.12);
  --green:#2A6545;  --green-l:rgba(42,101,69,.12);
  --purple:#5B3E8F; --purple-l:rgba(91,62,143,.12);
  --blue: #3E5B8F; --blue-l: rgba(62, 91, 143, 0.12);
  --rose: #8F3E6D; --rose-l: rgba(143, 62, 109, 0.12);
  --crimson: #8F3E4E; --crimson-l: rgba(143, 62, 78, 0.12);
  --slate: #54647A; --slate-l: rgba(84, 100, 122, 0.12);
  --sepia: #735343; --sepia-l: rgba(115, 83, 67, 0.12);
  --pink: #E83E8C; --pink-l: rgba(232, 62, 140, 0.12);
  --orchid: #B534B3; --orchid-l: rgba(181, 52, 179, 0.12);
  --orange:#C97C2A; --orange-l:rgba(201,124,42,.12);
  --sh-s:0 2px 8px rgba(28,25,23,.07);
  --sh-m:0 8px 28px rgba(28,25,23,.12);
  --sh-l:0 24px 56px rgba(28,25,23,.18);
  --sh-xl:0 40px 80px rgba(28,25,23,.22);
  --r-s:8px; --r-m:14px; --r-l:20px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --smooth:cubic-bezier(.4,0,.2,1);
  --bounce:cubic-bezier(.68,-.55,.27,1.55);
}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation}
img,svg{max-width:100%}
.app{position:fixed;left:0;top:0;width:100%;height:var(--app-h,100dvh);display:flex;overflow:hidden}

/* barra lateral */
#side{width:272px;flex-shrink:0;background:var(--sidebar);color:#EDE8DF;display:flex;flex-direction:column;gap:4px;padding:calc(12px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));transition:margin .28s var(--smooth),transform .28s var(--smooth),visibility 0s linear .28s;z-index:50}
body.side-collapsed #side{margin-left:-272px;visibility:hidden}
.sbrand{display:flex;align-items:center;gap:10px;padding:4px 6px 10px;font:600 17px Georgia,serif;color:#F4EFE6}
.logo{width:28px;height:28px;border-radius:8px;background:var(--amber);color:var(--ink);display:grid;place-items:center;font:700 15px Georgia,serif}
.sbrand .ibtn{margin-left:auto;display:none}
.ibtn{width:40px;height:40px;border-radius:10px;border:0;background:none;display:inline-grid;place-items:center;cursor:pointer;color:inherit;flex-shrink:0}
.ibtn:hover{background:rgba(28,25,23,.07)}
#side .ibtn:hover{background:rgba(255,255,255,.08)}
.newchat{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:var(--amber);color:var(--ink);font-weight:600;cursor:pointer;min-height:42px;transition:transform .25s var(--spring)}
.newchat:hover{transform:translateY(-1px)}
.nav{display:flex;flex-direction:column;gap:2px;margin:6px 0 2px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;border:0;background:none;color:#D9D3C9;cursor:pointer;text-align:left;min-height:40px;font-size:14px}
.nav-i:hover{background:rgba(255,255,255,.07)}
.nav-i em{margin-left:auto;font-style:normal;font-size:11px;color:var(--ink-faint)}
body.lib #lib,body.team #team{background:rgba(200,137,58,.2);color:#fff}
.rh{padding:10px 12px 2px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
.recents{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px}
.rg{padding:10px 8px 4px;font-size:11px;color:var(--ink-faint)}
.ri{display:flex;align-items:center;border-radius:10px}
.ri:hover{background:rgba(255,255,255,.07)}.ri.cur{background:rgba(255,255,255,.12)}
.rmain{flex:1;min-width:0;text-align:left;padding:9px 10px;border:0;background:none;color:#E6E0D6;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmore{width:32px;height:32px;border:0;background:none;color:#B9B3A9;border-radius:8px;cursor:pointer;display:grid;place-items:center;opacity:0;margin-right:4px;flex-shrink:0}
.ri:hover .rmore,.ri.cur .rmore,.rmore[aria-expanded="true"]{opacity:1}
.rmore:hover{background:rgba(255,255,255,.1)}
@media (hover:none){.rmore{opacity:1}}
.rempty{padding:14px 12px;font-size:13px;color:var(--ink-faint)}
.sbot{padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
.ubtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;border:0;background:none;color:#EDE8DF;cursor:pointer;text-align:left;min-height:48px}
.ubtn:hover,.ubtn[aria-expanded="true"]{background:rgba(255,255,255,.07)}
.av{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.ut{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.ut b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ut small{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scrim{display:none;position:fixed;inset:0;background:rgba(28,25,23,.5);z-index:45;opacity:0;pointer-events:none;transition:opacity .25s}

/* zona principal */
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.hdr{display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 12px 6px;min-height:56px;flex-shrink:0}
.ttl{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
#newm{display:none}
.stage{flex:1;min-height:0;display:flex}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
#chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 20px 24px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.view{display:none;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 20px calc(24px + env(safe-area-inset-bottom))}
body.lib #libview,body.team #teamview{display:block}
body.lib #chat,body.lib #askdock,body.lib form,body.team #chat,body.team #askdock,body.team form{display:none}
.hello{text-align:center;margin-top:12vh}
.hello h2{font:400 34px Georgia,serif}
.hello p{color:var(--ink-m);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.chip{background:var(--surface);border:1px solid rgba(28,25,23,.1);padding:8px 14px;border-radius:99px;cursor:pointer;font-size:13px;box-shadow:var(--sh-s);transition:transform .3s var(--spring);color:var(--ink)}
.chip:hover{transform:translateY(-3px);border-color:var(--amber)}
.chips.ask{justify-content:flex-start;margin-top:2px}
.msg{animation:in .4s var(--smooth) both;min-width:0}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}}
.msg.user{align-self:flex-end;background:var(--surface-2);padding:10px 16px;border-radius:var(--r-l);max-width:85%;box-shadow:var(--sh-s);overflow-wrap:anywhere;white-space:pre-wrap}
.bot{display:flex;flex-direction:column;gap:12px}
.bot p+p{margin-top:8px}
.bot p{overflow-wrap:anywhere}
.macts{display:flex;gap:2px;margin-top:-6px}
.mact{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:0;border-radius:8px;background:none;color:var(--ink-faint);font-size:12px;cursor:pointer;min-height:32px}
.mact:hover{background:rgba(28,25,23,.06);color:var(--ink)}
.bot .retry{display:none}.wrap>.msg.bot:last-child .retry{display:inline-flex}

/* tarjetas */
.files{display:flex;flex-direction:column;gap:10px}
.file{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface);border:1px solid rgba(28,25,23,.08);border-radius:var(--r-m);padding:12px 14px;box-shadow:var(--sh-s);transition:transform .35s var(--spring),box-shadow .3s;min-width:0}
.file:hover{transform:translateY(-3px);box-shadow:var(--sh-m)}
.ficon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.finfo{flex:1 1 200px;min-width:0}
.fname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{font-size:12px;color:var(--ink-faint);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
.dl{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r-s);color:#fff;text-decoration:none;font-size:13px;font-weight:600;flex-shrink:0;transition:transform .3s var(--spring),filter .2s;border:0;cursor:pointer;font-family:inherit;min-height:36px}
.dl:hover{transform:translateY(-2px);filter:brightness(1.1)}
.dl:disabled{opacity:.6;cursor:progress}
.c-teal{background:var(--teal)}.c-rust{background:var(--rust)}.c-green{background:var(--green)}.c-orange{background:var(--orange)}
.t-teal{background:var(--teal-l);color:var(--teal)}.t-rust{background:var(--rust-l);color:var(--rust)}.t-green{background:var(--green-l);color:var(--green)}.t-orange{background:var(--orange-l);color:var(--orange)}
.c-purple{background:var(--purple)}.t-purple{background:var(--purple-l);color:var(--purple)}
.c-blue{background:var(--blue)}.t-blue{background:var(--blue-l);color:var(--blue)}
.t-slate{background:var(--slate-l);color:var(--slate)}
.dl.soft{background:var(--surface-2);color:var(--ink);border:1px solid rgba(28,25,23,.08)}
.dl.rustc{color:var(--rust)}
.mat{display:block;padding:0}.mat summary{display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer;list-style:none}
.mat summary::-webkit-details-marker{display:none}
.mat .more{font-size:12px;font-weight:600;color:var(--purple);flex-shrink:0}
.mat[open] .more{opacity:.5}
.mbody{padding:2px 18px 16px 74px;font-size:13px;color:var(--ink-m);animation:in .35s var(--smooth)}
.mbody h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--purple);margin:12px 0 4px}
.mbody ul{padding-left:18px}.mbody li{margin:3px 0}
.prof{background:var(--surface);border:1px solid rgba(28,25,23,.08);border-radius:var(--r-m);padding:14px;box-shadow:var(--sh-s);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prof b{grid-column:1/-1;font-size:13px}.prof .sbtn{grid-column:1/-1}
.prof input{padding:9px 11px;border-radius:var(--r-s);border:1px solid rgba(28,25,23,.15);background:var(--surface-2);font:inherit;font-size:13px;min-width:0}
.prof input:focus{outline:2px solid var(--amber-glow);border-color:var(--amber)}
.sbtn{padding:9px 14px;border-radius:var(--r-s);border:0;background:var(--amber);color:var(--ink);font-weight:600;cursor:pointer;transition:transform .3s var(--spring);min-height:38px}
.sbtn:hover{transform:translateY(-2px)}
.sbtn.alt{background:var(--surface-2);color:var(--ink);border:1px solid rgba(28,25,23,.15)}
.sbtn.dng{background:var(--rust);color:#fff}
.sbtn:disabled{opacity:.4;cursor:not-allowed}

/* vistas */
.lh,#lgrid,#tbody{max-width:820px;margin:0 auto}
.lh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.lh h2{font:400 28px Georgia,serif;flex:1;min-width:140px}.lh small{color:var(--ink-faint)}
.lh input{padding:8px 14px;border-radius:99px;border:1px solid rgba(28,25,23,.15);background:var(--surface);font:inherit;font-size:13px;outline:none;min-width:0}
.lh input:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-glow)}
.vback{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid rgba(28,25,23,.12);background:var(--surface);cursor:pointer;font-size:13px;min-height:36px}
.vback:hover{border-color:var(--amber)}
.empty{text-align:center;color:var(--ink-faint);padding:48px 0}
#tbody{display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px;border:1px solid rgba(28,25,23,.08)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink-m);min-height:32px}
.seg button.on{background:var(--amber);color:var(--ink);font-weight:600}
.tm-bar{display:flex;gap:8px;flex-wrap:wrap}
.tm-bar select{flex:1;min-width:180px;padding:9px 12px;border-radius:var(--r-s);border:1px solid rgba(28,25,23,.15);background:var(--surface);font:inherit;font-size:13px}
.tm-card{background:var(--surface);border:1px solid rgba(28,25,23,.08);border-radius:var(--r-m);padding:14px 16px;box-shadow:var(--sh-s);display:flex;flex-direction:column;gap:10px}
.tm-mem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);background:var(--surface-2);cursor:pointer;font-size:13px}.tm-mem small{color:var(--ink-faint)}
.tm-acts{display:flex;gap:8px;flex-wrap:wrap}
.tm-acts .chip.rust{color:var(--rust)}

/* imágenes y preguntas */
.docw{display:flex;flex-direction:column;gap:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.imp{background:var(--surface);border:1px dashed rgba(28,25,23,.22);border-radius:var(--r-m);padding:12px 14px;display:flex;flex-direction:column;gap:10px;animation:in .3s var(--smooth)}
.imp-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}.imp-h small,.imp-note{color:var(--ink-faint);font-size:12px}.imp-note a{color:var(--blue)}
.imr{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:var(--r-s);padding:8px}
.imr img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#fff;flex-shrink:0}
.imf{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.imf input,.imf select{padding:6px 8px;border-radius:6px;border:1px solid rgba(28,25,23,.15);background:var(--surface);font:inherit;font-size:12px;min-width:0;max-width:100%}
.imo{display:flex;gap:6px;flex-wrap:wrap}
.imx{border:0;background:none;color:var(--rust);cursor:pointer;width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;flex-shrink:0}
.imx:hover{background:rgba(28,25,23,.06)}
#askdock{padding:0 20px 10px;flex-shrink:0}
.askw{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid rgba(28,25,23,.1);border-radius:var(--r-l);box-shadow:var(--sh-l);padding:18px 20px;max-height:min(62vh,calc(var(--app-h,100vh) * .62));overflow-y:auto;overscroll-behavior:contain;animation:in .35s var(--smooth);display:flex;flex-direction:column;gap:14px}
.askh{display:flex;justify-content:space-between;align-items:center;font:600 16px Georgia,serif}
.askq h5{font-size:13px;margin-bottom:8px}.askq h5 i{color:var(--rust);font-style:normal}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 14px;border-radius:99px;border:1px solid rgba(28,25,23,.15);background:var(--surface-2);cursor:pointer;font-size:13px;transition:transform .25s var(--spring),border-color .2s}
.opt:hover{transform:translateY(-2px);border-color:var(--amber)}
.opt.on{background:var(--amber-l);border-color:var(--amber);font-weight:600;box-shadow:0 0 0 2px var(--amber-glow)}
.opt.blk{display:block;width:100%;border-radius:var(--r-m);text-align:left}
.opt small{color:var(--purple);font-weight:600;margin-left:6px}
.afree{margin-top:8px;width:100%;padding:9px 12px;border-radius:var(--r-s);border:1px solid rgba(28,25,23,.15);background:var(--surface-2);font:inherit;font-size:13px;min-width:0}
.afree:focus{outline:2px solid var(--amber-glow);border-color:var(--amber)}
.askf{display:flex;justify-content:flex-end}

/* escribir */
.mbtn.local::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0}
#pwa-install-banner,#pwa-update-banner{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,160%);width:min(94vw,440px);background:var(--sidebar);color:#EDE8DF;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh-xl);z-index:95;visibility:hidden;pointer-events:none;transition:transform .35s var(--smooth),visibility 0s linear .35s}
#pwa-install-banner.show,#pwa-update-banner.show{transform:translate(-50%,0);visibility:visible;pointer-events:auto;transition:transform .35s var(--smooth),visibility 0s}
#pwa-install-banner p,#pwa-update-banner p{flex:1;font-size:13px;line-height:1.4}
#pwa-install-banner .sbtn,#pwa-update-banner .sbtn{white-space:nowrap}
#pwa-install-banner .ibtn,#pwa-update-banner .ibtn{width:34px;height:34px;color:#EDE8DF;opacity:.7}
#pwa-update-banner{bottom:calc(166px + env(safe-area-inset-bottom))}
.typing{display:flex;gap:5px;padding:6px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:b 1s infinite var(--smooth)}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.err{color:var(--rust);background:var(--rust-l);padding:10px 14px;border-radius:var(--r-m);font-size:13px}
form{padding:0 20px calc(14px + env(safe-area-inset-bottom));flex-shrink:0}
.box{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--surface);border-radius:22px;padding:8px 8px 8px 18px;box-shadow:var(--sh-m);border:1px solid rgba(28,25,23,.08)}
.box:focus-within{box-shadow:0 0 0 3px var(--amber-glow),var(--sh-m)}
textarea{flex:1;min-width:0;border:0;background:none;resize:none;font:inherit;color:var(--ink);max-height:160px;outline:none;padding:8px 0;line-height:1.45}
#send{width:40px;height:40px;border-radius:14px;border:0;background:var(--amber);color:var(--ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:transform .3s var(--spring)}
#send:hover{transform:scale(1.06)}#send:disabled{opacity:.4}
.below{max-width:760px;margin:6px auto 0;display:flex;align-items:center;padding:0 4px}
.mbtn{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 10px;border-radius:99px;border:0;background:none;color:var(--ink-m);cursor:pointer;font-size:12.5px;min-height:34px}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:rgba(28,25,23,.07);color:var(--ink)}
.mbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* menús */
.menu{position:fixed;z-index:90;min-width:210px;max-width:min(92vw,380px);max-height:min(70vh,calc(var(--app-h,100vh) - 24px));overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid rgba(28,25,23,.1);border-radius:14px;box-shadow:var(--sh-l);padding:6px;animation:pop .16s var(--smooth)}
.menu.wide{width:min(92vw,360px)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-size:14px;color:var(--ink);min-height:40px}
.mi:hover,.mi:focus-visible{background:var(--surface-2);outline:none}
.mi.danger{color:var(--rust)}.mi svg{flex-shrink:0;color:var(--ink-m)}.mi.danger svg{color:var(--rust)}

<script>
/* Motor de maquetación y render de tu generador (vista previa → canvas), usado para exportar a PDF */
(function(){

"use strict";

/* =========================================================================
   CONSTANTES DE MAQUETACIÓN
   ========================================================================= */
const EMU_PER_PX = 9525;          
const TWIPS_PER_PX = 15;          
const HALFPT_TO_PX = (hp) => (hp / 2) * (96 / 72); 
const PT_TO_PX = (pt) => pt * (96 / 72);

const DEFAULT_PAGE_W_PX = 794;    
const DEFAULT_PAGE_H_PX = 1123;   
const DEFAULT_MARGIN_PX = 96;     
const PAGE_GAP = 28;              

/* =========================================================================
   ESTADO GLOBAL
   ========================================================================= */
let state = {
  zip: null,
  mediaCache: {},      
  activeMediaCache: null, 
  relsMap: {},          
  styles: {},            
  docDefaults: {},       
  numbering: {},         
  abstractNum: {},       
  numCounters: {},       
  page: { w: DEFAULT_PAGE_W_PX, h: DEFAULT_PAGE_H_PX, mL: DEFAULT_MARGIN_PX, mR: DEFAULT_MARGIN_PX, mT: DEFAULT_MARGIN_PX, mB: DEFAULT_MARGIN_PX, headerDistPx: 48, footerDistPx: 48, titlePg: false },
  blocks: [],            
  pages: [],             
  headerRefs: {},         
  footerRefs: {},         
  headers: {},             
  footers: {},             
  headerLayout: {},        
  footerLayout: {},        
  zoom: 1,
  images: {}             
};

const canvas = document.getElementById('dv_renderCanvas');
let ctx = canvas.getContext('2d');   // «let»: exportPages() lo cambia un instante para dibujar en un canvas aparte
const viewport = document.getElementById('dv_viewport');
const canvasHost = document.getElementById('dv_canvasHost');
const emptyState = document.getElementById('dv_emptyState');
const statusText = document.getElementById('dv_statusText');
const fileNameLabel = document.getElementById('dv_fileNameLabel');
const pageIndicator = document.getElementById('dv_pageIndicator');
const zoomLabel = document.getElementById('dv_zoomLabel');

function setStatus(msg, kind){
  statusText.textContent = msg || '';
  statusText.className = kind ? kind : '';
}

/* =========================================================================
   CARGA DE ARCHIVO (adaptado: recibe un Blob ya generado en memoria,
   en vez de un <input type=file>, para alimentar la vista previa en vivo)
   ========================================================================= */
async function handleFile(blobOrFile, displayName){
  try{
    fileNameLabel.textContent = displayName || (blobOrFile && blobOrFile.name) || 'vista_previa.docx';
    setStatus('Procesando plantilla… ', 'ok');
    emptyState.classList.add('dv-hidden');
    canvas.classList.remove('dv-hidden');

    const arrayBuffer = await blobOrFile.arrayBuffer();
    const zip = await JSZip.loadAsync(arrayBuffer);
    state.zip = zip;
    state.mediaCache = {};
    state.activeMediaCache = null;
    state.relsMap = {};
    state.styles = {};
    state.numbering = {};
    state.abstractNum = {};
    state.numCounters = {};
    state.blocks = [];
    state.pages = [];
    state.headerRefs = {};
    state.footerRefs = {};
    state.headers = {};
    state.footers = {};
    state.headerLayout = {};
    state.footerLayout = {};

    setStatus('Leyendo relaciones (rels)…', 'ok');
    await loadRelationships(zip);

    setStatus('Extrayendo imágenes multimedia…', 'ok');
    await loadMedia(zip);

    setStatus('Procesando estilos (styles.xml)…', 'ok');
    await loadStyles(zip);

    setStatus('Procesando listas (numbering.xml)…', 'ok');
    await loadNumbering(zip);

    setStatus('Procesando document.xml…', 'ok');
    await loadDocument(zip);

    setStatus('Procesando encabezados y pies de página…', 'ok');
    await loadHeadersFooters(zip);

    setStatus('Calculando maquetación (layout engine)…', 'ok');
    await computeLayout();
    await layoutHeadersFooters();

    setStatus('Renderizando en Canvas…', 'ok');
    await renderAllPages();

    setStatus(`Listo — ${state.pages.length} página(s)`, 'ok');
  }catch(err){
    console.error(err);
    setStatus('Error al procesar el documento: ' + err.message, 'error');
  }
}

/* =========================================================================
   UTILIDADES XML
   ========================================================================= */
const parser = new DOMParser();

function parseXML(text){
  return parser.parseFromString(text, 'application/xml');
}

function children(el, localName){
  if (!el) return [];
  const out = [];
  for (const c of el.children){
    if (c.localName === localName) out.push(c);
  }
  return out;
}
function child(el, localName){
  if (!el) return null;
  for (const c of el.children){
    if (c.localName === localName) return c;
  }
  return null;
}
function attr(el, name){
  if (!el) return null;
  return el.getAttribute(name) || el.getAttribute('w:' + name) || el.getAttributeNS(null, name);
}
function findAll(el, localName){
  if (!el) return [];
  return Array.from(el.getElementsByTagName('*')).filter(n => n.localName === localName);
}

/* =========================================================================
   1) RELACIONES (document.xml.rels)
   ========================================================================= */
async function loadRelationships(zip){
  const relsFile = zip.file('word/_rels/document.xml.rels');
  if (!relsFile) return;
  const text = await relsFile.async('string');
  const xml = parseXML(text);
  const rels = xml.getElementsByTagName('Relationship');
  for (const rel of rels){
    const id = rel.getAttribute('Id');
    const target = rel.getAttribute('Target');
    state.relsMap[id] = target;
  }
}

/* =========================================================================
   2) MEDIA (imágenes -> DataURL base64)
   ========================================================================= */
const MIME_BY_EXT = {
  png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
  gif: 'image/gif', bmp: 'image/bmp', svg: 'image/svg+xml',
  emf: 'image/x-emf', wmf: 'image/x-wmf', tif: 'image/tiff', tiff: 'image/tiff'
};

async function buildMediaCache(zip, relsMap){
  const cache = {};
  for (const rId in relsMap){
    const target = relsMap[rId];
    if (!target || !/media\//.test(target)) continue;
    let path = target.replace(/^\.?\/?/, '');
    if (!path.startsWith('word/')) path = 'word/' + path;
    const f = zip.file(path);
    if (!f) continue;
    const ext = (path.split('.').pop() || '').toLowerCase();
    const mime = MIME_BY_EXT[ext] || 'application/octet-stream';
    if (mime === 'image/x-emf' || mime === 'image/x-wmf') continue;
    try{
      const base64 = await f.async('base64');
      cache[rId] = `data:${mime};base64,${base64}`;
    }catch(e){ }
  }
  return cache;
}

async function loadMedia(zip){
  state.mediaCache = await buildMediaCache(zip, state.relsMap);
  state.activeMediaCache = state.mediaCache;
}

function preloadImage(dataUrl){
  return new Promise((resolve) => {
    if (state.images[dataUrl]) { resolve(state.images[dataUrl]); return; }
    const img = new Image();
    img.onload = () => { state.images[dataUrl] = img; resolve(img); };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

/* =========================================================================
   3) ESTILOS (styles.xml)
   ========================================================================= */
function parseRunProps(rPrEl){
  if (!rPrEl) return {};
  const p = {};
  const b = child(rPrEl, 'b');
  if (b) p.bold = attr(b,'val') !== 'false' && attr(b,'val') !== '0';
  const i = child(rPrEl, 'i');
  if (i) p.italic = attr(i,'val') !== 'false' && attr(i,'val') !== '0';
  const u = child(rPrEl, 'u');
  if (u && attr(u,'val') && attr(u,'val') !== 'none') p.underline = true;
  const strike = child(rPrEl, 'strike');
  if (strike) p.strike = attr(strike,'val') !== 'false';
  const color = child(rPrEl, 'color');
  if (color){
    const v = attr(color,'val');
    if (v && v !== 'auto') p.color = '#' + v;
  }
  const sz = child(rPrEl, 'sz');
  if (sz) p.sizePx = HALFPT_TO_PX(parseFloat(attr(sz,'val')) || 24);
  const fonts = child(rPrEl, 'rFonts');
  if (fonts){
    const f = attr(fonts,'ascii') || attr(fonts,'hAnsi') || attr(fonts,'cs');
    if (f) p.font = f;
  }
  const highlight = child(rPrEl, 'highlight');
  if (highlight){
    const v = attr(highlight,'val');
    if (v && v !== 'none') p.highlight = v;
  }
  const vertAlign = child(rPrEl, 'vertAlign');
  if (vertAlign) p.vertAlign = attr(vertAlign,'val');
  return p;
}

function parseParaProps(pPrEl){
  if (!pPrEl) return {};
  const p = {};
  const jc = child(pPrEl, 'jc');
  if (jc) p.align = attr(jc,'val'); 
  const ind = child(pPrEl, 'ind');
  if (ind){
    p.indent = {};
    const left = attr(ind,'left') || attr(ind,'start');
    const right = attr(ind,'right') || attr(ind,'end');
    const first = attr(ind,'firstLine');
    const hang = attr(ind,'hanging');
    if (left) p.indent.left = parseFloat(left) / TWIPS_PER_PX;
    if (right) p.indent.right = parseFloat(right) / TWIPS_PER_PX;
    if (first) p.indent.firstLine = parseFloat(first) / TWIPS_PER_PX;
    if (hang) p.indent.hanging = -parseFloat(hang) / TWIPS_PER_PX;
  }
  const spacing = child(pPrEl, 'spacing');
  if (spacing){
    p.spacing = {};
    const before = attr(spacing,'before');
    const after = attr(spacing,'after');
    const line = attr(spacing,'line');
    if (before) p.spacing.before = parseFloat(before) / TWIPS_PER_PX;
    if (after) p.spacing.after = parseFloat(after) / TWIPS_PER_PX;
    if (line) p.spacing.line = parseFloat(line) / 240;
  }
  const pStyle = child(pPrEl, 'pStyle');
  if (pStyle) p.styleId = attr(pStyle,'val');
  const numPr = child(pPrEl, 'numPr');
  if (numPr){
    const ilvl = child(numPr,'ilvl');
    const numId = child(numPr,'numId');
    p.numPr = {
      ilvl: ilvl ? parseInt(attr(ilvl,'val')||'0',10) : 0,
      numId: numId ? attr(numId,'val') : null
    };
  }
  const pageBreakBefore = child(pPrEl, 'pageBreakBefore');
  if (pageBreakBefore) p.pageBreakBefore = true;
  if (child(pPrEl, 'sectPr')) p.sectBreakAfter = true;
  const keepNext = child(pPrEl, 'keepNext');
  if (keepNext) p.keepNext = true;
  return p;
}

async function loadStyles(zip){
  const f = zip.file('word/styles.xml');
  if (!f){
    state.docDefaults = { run: { font: 'Calibri', sizePx: HALFPT_TO_PX(22), color:'#000000' }, para: {} };
    return;
  }
  const text = await f.async('string');
  const xml = parseXML(text);
  const root = xml.documentElement;

  const docDefaultsEl = child(root, 'docDefaults');
  let defaultRun = { font: 'Calibri', sizePx: HALFPT_TO_PX(22), color: '#000000' };
  let defaultPara = {};
  if (docDefaultsEl){
    const rpd = child(docDefaultsEl, 'rPrDefault');
    if (rpd) Object.assign(defaultRun, parseRunProps(child(rpd,'rPr')));
    const ppd = child(docDefaultsEl, 'pPrDefault');
    if (ppd) Object.assign(defaultPara, parseParaProps(child(ppd,'pPr')));
  }
  state.docDefaults = { run: defaultRun, para: defaultPara };

  const styleEls = children(root, 'style');
  const rawStyles = {};
  for (const s of styleEls){
    const id = attr(s,'styleId');
    const type = attr(s,'type');
    const nameEl = child(s,'name');
    const basedOnEl = child(s,'basedOn');
    rawStyles[id] = {
      id, type,
      name: nameEl ? attr(nameEl,'val') : id,
      basedOn: basedOnEl ? attr(basedOnEl,'val') : null,
      run: parseRunProps(child(s,'rPr')),
      para: parseParaProps(child(s,'pPr')),
      isDefault: attr(s,'default') === '1'
    };
  }

  const resolved = {};
  function resolveStyle(id, seen){
    if (!id || !rawStyles[id]) return { run:{}, para:{} };
    if (resolved[id]) return resolved[id];
    seen = seen || new Set();
    if (seen.has(id)) return { run:{}, para:{} };
    seen.add(id);
    const raw = rawStyles[id];
    const parent = raw.basedOn ? resolveStyle(raw.basedOn, seen) : { run:{}, para:{} };
    const merged = {
      run: Object.assign({}, parent.run, raw.run),
      para: Object.assign({}, parent.para, raw.para, {
        indent: Object.assign({}, parent.para.indent, raw.para.indent),
        spacing: Object.assign({}, parent.para.spacing, raw.para.spacing)
      })
    };
    resolved[id] = merged;
    return merged;
  }
  for (const id in rawStyles) resolveStyle(id);
  state.styles = resolved;
  state.rawStylesMeta = rawStyles;
}

function getEffectiveStyleForParagraph(styleId){
  if (styleId && state.styles[styleId]) return state.styles[styleId];
  return { run:{}, para:{} };
}

/* =========================================================================
   4) NUMBERING (listas) numbering.xml
   ========================================================================= */
async function loadNumbering(zip){
  const f = zip.file('word/numbering.xml');
  if (!f) return;
  const text = await f.async('string');
  const xml = parseXML(text);
  const root = xml.documentElement;

  const abstractNums = children(root, 'abstractNum');
  for (const an of abstractNums){
    const id = attr(an, 'abstractNumId');
    const levels = {};
    for (const lvl of children(an, 'lvl')){
      const ilvl = parseInt(attr(lvl,'ilvl') || '0', 10);
      const numFmtEl = child(lvl,'numFmt');
      const lvlTextEl = child(lvl,'lvlText');
      const startEl = child(lvl,'start');
      const indEl = child(lvl, 'pPr') ? child(child(lvl,'pPr'),'ind') : null;
      levels[ilvl] = {
        numFmt: numFmtEl ? attr(numFmtEl,'val') : 'decimal',
        lvlText: lvlTextEl ? attr(lvlTextEl,'val') : '%1.',
        start: startEl ? parseInt(attr(startEl,'val')||'1',10) : 1,
        indentLeft: indEl && attr(indEl,'left') ? parseFloat(attr(indEl,'left'))/TWIPS_PER_PX : (18 + ilvl*24)
      };
    }
    state.abstractNum[id] = { levels };
  }
  const nums = children(root, 'num');
  for (const n of nums){
    const numId = attr(n, 'numId');
    const abstractIdEl = child(n, 'abstractNumId');
    state.numbering[numId] = { abstractId: abstractIdEl ? attr(abstractIdEl,'val') : null };
  }
}

function getListLevelInfo(numId, ilvl){
  const numDef = state.numbering[numId];
  if (!numDef) return null;
  const abs = state.abstractNum[numDef.abstractId];
  if (!abs) return null;
  return abs.levels[ilvl] || abs.levels[0] || null;
}

function nextListLabel(numId, ilvl, numFmt, lvlText){
  if (!state.numCounters[numId]) state.numCounters[numId] = {};
  const counters = state.numCounters[numId];
  if (counters[ilvl] === undefined){
    const info = getListLevelInfo(numId, ilvl);
    counters[ilvl] = (info && info.start) ? info.start : 1;
  } else {
    counters[ilvl]++;
  }
  for (const k in counters){
    if (parseInt(k,10) > ilvl) delete counters[k];
  }
  const n = counters[ilvl];
  if (numFmt === 'bullet'){
    return lvlText || '•';
  }
  let label = toFormattedNumber(n, numFmt);
  if (lvlText){
    label = lvlText.replace(/%\d/g, label);
  }
  return label;
}

function toFormattedNumber(n, fmt){
  switch(fmt){
    case 'decimal': return String(n);
    case 'lowerLetter': return numberToLetters(n).toLowerCase();
    case 'upperLetter': return numberToLetters(n).toUpperCase();
    case 'lowerRoman': return toRoman(n).toLowerCase();
    case 'upperRoman': return toRoman(n).toUpperCase();
    default: return String(n);
  }
}
function numberToLetters(n){
  let s = '';
  while (n > 0){
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}
function toRoman(n){
  const map = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],
    [50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let out = '';
  for (const [val, sym] of map){
    while (n >= val){ out += sym; n -= val; }
  }
  return out;
}

/* =========================================================================
   5) DOCUMENT.XML  -> árbol de bloques (párrafos / tablas)
   ========================================================================= */
async function loadDocument(zip){
  const f = zip.file('word/document.xml');
  if (!f) throw new Error('word/document.xml no encontrado — el archivo no es un .docx válido.');
  const text = await f.async('string');
  const xml = parseXML(text);
  const root = xml.documentElement;
  const body = child(root, 'body');
  if (!body) throw new Error('No se encontró <w:body> en el documento.');

  const sectPr = Array.from(body.getElementsByTagName('w:sectPr')).find(x => x.getAttribute('w:rsidR') === '00D7A001') || child(body, 'sectPr');
  if (sectPr){
    const pgSz = child(sectPr, 'pgSz');
    const pgMar = child(sectPr, 'pgMar');
    if (pgSz){
      const w = attr(pgSz,'w'), h = attr(pgSz,'h');
      if (w) state.page.w = Math.round(parseFloat(w) / TWIPS_PER_PX);
      if (h) state.page.h = Math.round(parseFloat(h) / TWIPS_PER_PX);
    }
    if (pgMar){
      const mL = attr(pgMar,'left'), mR = attr(pgMar,'right'),
            mT = attr(pgMar,'top'), mB = attr(pgMar,'bottom');
      if (mL) state.page.mL = parseFloat(mL) / TWIPS_PER_PX;
      if (mR) state.page.mR = parseFloat(mR) / TWIPS_PER_PX;
      if (mT) state.page.mT = parseFloat(mT) / TWIPS_PER_PX;
      if (mB) state.page.mB = parseFloat(mB) / TWIPS_PER_PX;
      const headerD = attr(pgMar,'header');
      const footerD = attr(pgMar,'footer');
      if (headerD) state.page.headerDistPx = parseFloat(headerD) / TWIPS_PER_PX - 5;
      if (footerD) state.page.footerDistPx = parseFloat(footerD) / TWIPS_PER_PX;
    }
    state.page.titlePg = !!child(sectPr, 'titlePg');

    for (const hRef of children(sectPr, 'headerReference')){
      const type = attr(hRef, 'type') || 'default';
      const rId = hRef.getAttribute('r:id') || hRef.getAttribute('id');
      if (rId) state.headerRefs[type] = rId;
    }
    for (const fRef of children(sectPr, 'footerReference')){
      const type = attr(fRef, 'type') || 'default';
      const rId = fRef.getAttribute('r:id') || fRef.getAttribute('id');
      if (rId) state.footerRefs[type] = rId;
    }
  }

  state.blocks = parseBodyChildren(body);
  state.blocks.forEach((b, i) => { if (b && b.sectBreakAfter && state.blocks[i + 1]) state.blocks[i + 1].pageBreakBefore = true; });
}

async function loadHeadersFooters(zip){
  for (const type in state.headerRefs){
    const rId = state.headerRefs[type];
    const target = state.relsMap[rId];
    if (!target) continue;
    let path = target.replace(/^\.?\/?/, '');
    if (!path.startsWith('word/')) path = 'word/' + path;
    const blocks = await parseHeaderFooterPart(zip, path);
    if (blocks) state.headers[type] = blocks;
  }
  for (const type in state.footerRefs){
    const rId = state.footerRefs[type];
    const target = state.relsMap[rId];
    if (!target) continue;
    let path = target.replace(/^\.?\/?/, '');
    if (!path.startsWith('word/')) path = 'word/' + path;
    const blocks = await parseHeaderFooterPart(zip, path);
    if (blocks) state.footers[type] = blocks;
  }
}

async function parseHeaderFooterPart(zip, path){
  const f = zip.file(path);
  if (!f) return null;
  const text = await f.async('string');
  const xml = parseXML(text);
  const root = xml.documentElement; 
  if (!root) return null;

  const dirEnd = path.lastIndexOf('/');
  const dir = dirEnd >= 0 ? path.slice(0, dirEnd + 1) : '';
  const fileName = dirEnd >= 0 ? path.slice(dirEnd + 1) : path;
  const relsPath = `${dir}_rels/${fileName}.rels`;
  const relsFile = zip.file(relsPath);
  let localRels = {};
  if (relsFile){
    const relsText = await relsFile.async('string');
    const relsXml = parseXML(relsText);
    for (const rel of relsXml.getElementsByTagName('Relationship')){
      localRels[rel.getAttribute('Id')] = rel.getAttribute('Target');
    }
  }
  const localMediaCache = await buildMediaCache(zip, localRels);

  const previousCache = state.activeMediaCache;
  state.activeMediaCache = localMediaCache;
  const blocks = parseBodyChildren(root);
  state.activeMediaCache = previousCache;

  return blocks;
}

function parseBodyChildren(container){
  const blocks = [];
  for (const el of container.children){
    if (el.localName === 'p'){
      blocks.push(parseParagraph(el));
    } else if (el.localName === 'tbl'){
      blocks.push(parseTable(el));
    }
  }
  return blocks;
}

function parseParagraph(pEl){
  const pPr = child(pEl, 'pPr');
  const directPara = parseParaProps(pPr);
  const styleId = directPara.styleId;
  const styleDef = getEffectiveStyleForParagraph(styleId);

  const effectivePara = Object.assign({}, state.docDefaults.para, styleDef.para, directPara, {
    indent: Object.assign({}, state.docDefaults.para.indent, styleDef.para.indent, directPara.indent),
    spacing: Object.assign({}, state.docDefaults.para.spacing, styleDef.para.spacing, directPara.spacing)
  });

  const runs = [];
  for (const child_ of pEl.children){
    if (child_.localName === 'r'){
      runs.push(...parseRun(child_, styleDef.run));
    } else if (child_.localName === 'hyperlink'){
      for (const r of children(child_, 'r')){
        runs.push(...parseRun(r, styleDef.run));
      }
    } else if (child_.localName === 'fldSimple'){
      for (const r of children(child_, 'r')){
        runs.push(...parseRun(r, styleDef.run));
      }
    }
  }

  let tm = null;
  for (const bm of children(pEl, 'bookmarkStart')){
    const nm = bm.getAttribute('w:name') || bm.getAttribute('name') || '';
    if (nm.indexOf('_tm_') === 0){ tm = nm; break; }
  }
  return {
    type: 'paragraph',
    para: effectivePara,
    runs,
    isEmpty: runs.length === 0,
    tm
  };
}

function parseRun(rEl, baseStyleRun){
  const rPr = child(rEl, 'rPr');
  const directRun = parseRunProps(rPr);
  const effectiveRun = Object.assign({}, state.docDefaults.run, baseStyleRun, directRun);

  const items = [];
  for (const node of rEl.children){
    switch(node.localName){
      case 't': {
        const text = node.textContent || '';
        items.push({ kind:'text', text, style: effectiveRun });
        break;
      }
      case 'tab': {
        items.push({ kind:'tab', style: effectiveRun });
        break;
      }
      case 'br': {
        const brType = attr(node,'type');
        items.push({ kind: brType === 'page' ? 'pageBreak' : 'lineBreak', style: effectiveRun });
        break;
      }
      case 'drawing': {
        const img = extractDrawingImage(node);
        if (img){
          items.push({ kind: img.isFloating ? 'floatingImage' : 'image', image: img, style: effectiveRun });
        }
        break;
      }
      case 'pict': {
        const img = extractDrawingImage(node);
        if (img) items.push({ kind: img.isFloating ? 'floatingImage' : 'image', image: img, style: effectiveRun });
        break;
      }
      default: break;
    }
  }
  return items;
}

function parsePosition(posEl){
  if (!posEl) return { relativeFrom: 'column', offset: 0, align: null };
  const relativeFrom = posEl.getAttribute('relativeFrom') || 'column';
  let offset = 0;
  const offsetEl = child(posEl, 'posOffset');
  if (offsetEl){
    const emu = parseFloat(offsetEl.textContent);
    if (!isNaN(emu)) offset = emu / EMU_PER_PX;
  }
  let align = null;
  const alignEl = child(posEl, 'align');
  if (alignEl) align = (alignEl.textContent || '').trim();
  return { relativeFrom, offset, align };
}

function extractDrawingImage(drawingEl){
  const anchorEl = child(drawingEl, 'anchor');
  const inlineEl = child(drawingEl, 'inline');
  const containerEl = anchorEl || inlineEl;
  if (!containerEl) return null;

  const blips = findAll(drawingEl, 'blip');
  if (blips.length === 0) return null;
  const blip = blips[0];
  const rEmbed = blip.getAttribute('r:embed') || blip.getAttribute('embed');
  if (!rEmbed) return null;
  const activeCache = state.activeMediaCache || state.mediaCache;
  const dataUrl = activeCache[rEmbed];
  if (!dataUrl) return null;

  let widthPx = 200, heightPx = 150;
  const extEl = child(containerEl, 'extent');
  if (extEl){
    const cx = parseFloat(extEl.getAttribute('cx'));
    const cy = parseFloat(extEl.getAttribute('cy'));
    if (cx && cy){
      widthPx = cx / EMU_PER_PX;
      heightPx = cy / EMU_PER_PX;
    }
  }

  let opacity = 1;
  const alphaModEls = findAll(drawingEl, 'alphaModFix');
  if (alphaModEls.length){
    const amt = alphaModEls[0].getAttribute('amt');
    if (amt !== null) opacity = Math.max(0, Math.min(1, parseFloat(amt) / 100000));
  } else {
    const alphaEls = findAll(drawingEl, 'alpha');
    if (alphaEls.length){
      const amt = alphaEls[0].getAttribute('val') || alphaEls[0].getAttribute('amt');
      if (amt !== null) opacity = Math.max(0, Math.min(1, parseFloat(amt) / 100000));
    }
  }

  let rotation = 0;
  const xfrmEls = findAll(drawingEl, 'xfrm');
  if (xfrmEls.length){
    const rot = xfrmEls[0].getAttribute('rot');
    if (rot) rotation = (parseFloat(rot) / 60000) * Math.PI / 180;
  }

  const result = { dataUrl, widthPx, heightPx, opacity, rotation, isFloating: false };

  if (anchorEl){
    result.isFloating = true;
    result.behindDoc = anchorEl.getAttribute('behindDoc') === '1';
    result.relativeHeight = parseInt(anchorEl.getAttribute('relativeHeight') || '0', 10);
    const posH = child(anchorEl, 'positionH');
    const posV = child(anchorEl, 'positionV');
    result.posH = parsePosition(posH);
    result.posV = parsePosition(posV);
  }

  return result;
}

function parseTable(tblEl){
  const tblGrid = child(tblEl, 'tblGrid');
  const colWidths = [];
  if (tblGrid){
    for (const gridCol of children(tblGrid, 'gridCol')){
      const w = attr(gridCol, 'w');
      colWidths.push(w ? parseFloat(w) / TWIPS_PER_PX : 100);
    }
  }
  const rows = [];
  for (const tr of children(tblEl, 'tr')){
    const cells = [];
    for (const tc of children(tr, 'tc')){
      const tcPr = child(tc, 'tcPr');
      let gridSpan = 1;
      if (tcPr){
        const gs = child(tcPr, 'gridSpan');
        if (gs) gridSpan = parseInt(attr(gs,'val') || '1', 10);
      }
      const cellBlocks = parseBodyChildren(tc);
      cells.push({ blocks: cellBlocks, gridSpan });
    }
    rows.push({ cells });
  }
  return { type:'table', colWidths, rows };
}

/* =========================================================================
   6) MOTOR DE LAYOUT
   ========================================================================= */

function fontString(style, scale){
  scale = scale || 1;
  const sizePx = (style.sizePx || 16) * scale;
  const weight = style.bold ? 'bold' : 'normal';
  const styleAttr = style.italic ? 'italic' : 'normal';
  const family = mapFontFamily(style.font);
  return `${styleAttr} ${weight} ${sizePx}px ${family}`;
}
function mapFontFamily(f){
  if (!f) return 'Calibri, Arial, sans-serif';
  return `"${f}", Calibri, Arial, sans-serif`;
}

function newPageLayout(){
  return {
    w: state.page.w, h: state.page.h,
    ops: [],
    floatingBehind: [],  
    floatingFront: [],   
    cursorY: state.page.mT
  };
}

async function computeLayout(){
  const measureCtx = ctx;
  const pages = [];
  function createBodyPage() {
    const headerH = (state.headerLayout && state.headerLayout.default) ? state.headerLayout.default.height : 0;
    const startY = Math.max(state.page.mT, state.page.headerDistPx + headerH);
    return { w: state.page.w, h: state.page.h, ops: [], floatingBehind: [], floatingFront: [], cursorY: startY };
  }
  let current = newPageLayout();
  pages.push(current);

  const contentLeft = state.page.mL;
  const contentWidth = state.page.w - state.page.mL - state.page.mR;

  function ensureSpace(neededHeight, forcePageBreak){
    if (forcePageBreak || current.cursorY + neededHeight > state.page.h - state.page.mB){
      current = newPageLayout();
      pages.push(current);
    }
  }

  for (let bi = 0; bi < state.blocks.length; bi++){
    const block = state.blocks[bi];
    const snap = pages.map(p => p.ops.length);
    if (block.type === 'paragraph'){
      await layoutParagraph(block, contentLeft, contentWidth, pages, () => current, (p) => { current = p; }, ensureSpace);
    } else if (block.type === 'table'){
      await layoutTable(block, contentLeft, contentWidth, pages, () => current, (p) => { current = p; }, ensureSpace);
    }
    pages.forEach((pg, pi) => { for (let k = (snap[pi] || 0); k < pg.ops.length; k++) pg.ops[k].blk = bi; });
  }

  state.pages = pages;

  // Rectángulos de los bloques marcados (_tm_*) para el editor visual
  const rects = [];
  pages.forEach((pg, pi) => {
    const by = new Map();
    pg.ops.forEach(op => {
      if (op.blk == null || (op.op !== 'text' && op.op !== 'image')) return;
      const blk = state.blocks[op.blk];
      if (!blk || !blk.tm) return;
      const hh = op.op === 'image' ? op.h : (op.baseline || 0);
      let r = by.get(op.blk);
      if (!r){
        r = { tm: blk.tm, page: pi, x0: op.x, x1: op.x + (op.w || 0), y0: op.y, y1: op.y + hh, img: null, fs: null, lh: 0, align: blk.para.align || 'left' };
        by.set(op.blk, r);
      } else {
        r.x0 = Math.min(r.x0, op.x); r.x1 = Math.max(r.x1, op.x + (op.w || 0));
        r.y0 = Math.min(r.y0, op.y); r.y1 = Math.max(r.y1, op.y + hh);
      }
      if (op.op === 'image') r.img = { x: op.x, y: op.y, w: op.w, h: op.h };
      if (op.op === 'text' && !r.fs && op.text && op.text.trim() && op.text.trim() !== '•'){ r.fs = op.style; r.lh = op.baseline || 0; }
    });
    by.forEach(r => rects.push(r));
  });
  state.blockRects = rects;
}

async function layoutHeaderFooterBlocks(blocks, width){
  if (!blocks || blocks.length === 0) return { ops: [], floatingBehind: [], floatingFront: [], height: 0 };
  let bufferPage = { w: width, h: 999999, ops: [], floatingBehind: [], floatingFront: [], cursorY: 0 };
  const pagesBuf = [bufferPage];
  const noPaginate = () => { };
  for (const block of blocks){
    if (block.type === 'paragraph'){
      await layoutParagraph(block, 0, width, pagesBuf, () => bufferPage, (p) => { bufferPage = p; }, noPaginate);
    } else if (block.type === 'table'){
      await layoutTable(block, 0, width, pagesBuf, () => bufferPage, (p) => { bufferPage = p; }, noPaginate);
    }
  }
  return {
    ops: bufferPage.ops,
    floatingBehind: bufferPage.floatingBehind,
    floatingFront: bufferPage.floatingFront,
    height: bufferPage.cursorY
  };
}

async function layoutHeadersFooters(){
  const contentWidth = state.page.w - state.page.mL - state.page.mR;
  state.headerLayout = {};
  state.footerLayout = {};
  for (const type in state.headers){
    state.headerLayout[type] = await layoutHeaderFooterBlocks(state.headers[type], contentWidth);
  }
  for (const type in state.footers){
    state.footerLayout[type] = await layoutHeaderFooterBlocks(state.footers[type], contentWidth);
  }
}

async function layoutParagraph(block, contentLeft, contentWidth, pages, getCurrent, setCurrent, ensureSpace){
  const para = block.para;
  const lineHeightMultiplier = (para.spacing && para.spacing.line) ? para.spacing.line : 1.15;
  const spaceBefore = (para.spacing && para.spacing.before) || 0;
  const spaceAfter = (para.spacing && para.spacing.after) || 0;

  let indentLeft = (para.indent && para.indent.left) || 0;
  const indentRight = (para.indent && para.indent.right) || 0;
  let firstLineExtra = 0;
  if (para.indent){
    if (para.indent.firstLine) firstLineExtra = para.indent.firstLine;
    if (para.indent.hanging) firstLineExtra = para.indent.hanging;
  }

  let listLabel = null;
  if (para.numPr && para.numPr.numId && para.numPr.numId !== '0'){
    const info = getListLevelInfo(para.numPr.numId, para.numPr.ilvl || 0);
    if (info){
      listLabel = nextListLabel(para.numPr.numId, para.numPr.ilvl || 0, info.numFmt, info.lvlText);
      indentLeft = Math.max(indentLeft, info.indentLeft || (18 + (para.numPr.ilvl||0)*24));
    }
  }

  if (para.pageBreakBefore){
    let cur = getCurrent();
    const np = newPageLayout();
    pages.push(np);
    setCurrent(np);
  }

  spaceIfNeeded(spaceBefore, getCurrent, setCurrent, pages);

  const floatItems = block.runs.filter(it => it.kind === 'floatingImage');
  if (floatItems.length){
    const cur = getCurrent();
    for (const fi of floatItems){
      const posH = fi.image.posH || { relativeFrom: 'column', offset: 0, align: null };
      const posV = fi.image.posV || { relativeFrom: 'paragraph', offset: 0, align: null };

      let x = 0, y = 0;
      let isAbsX = false, isAbsY = false;

      const relH = posH.relativeFrom;
      if (relH === 'page'){
        if (posH.align === 'center') x = (state.page.w - fi.image.widthPx)/2;
        else if (posH.align === 'right') x = state.page.w - fi.image.widthPx;
        else x = posH.offset;
        isAbsX = true;
      } else if (relH === 'margin' || relH === 'leftMargin' || relH === 'rightMargin'){
        const avail = state.page.w - state.page.mL - state.page.mR;
        if (posH.align === 'center') x = state.page.mL + (avail - fi.image.widthPx)/2;
        else if (posH.align === 'right') x = state.page.mL + avail - fi.image.widthPx;
        else x = state.page.mL + posH.offset;
        isAbsX = true;
      } else {
        const avail = contentWidth;
        if (posH.align === 'center') x = contentLeft + (avail - fi.image.widthPx)/2;
        else if (posH.align === 'right') x = contentLeft + avail - fi.image.widthPx;
        else x = contentLeft + posH.offset;
        isAbsX = false;
      }

      const relV = posV.relativeFrom;
      if (relV === 'page'){
        if (posV.align === 'center') y = (state.page.h - fi.image.heightPx)/2;
        else if (posV.align === 'bottom') y = state.page.h - fi.image.heightPx;
        else y = posV.offset;
        isAbsY = true;
      } else if (relV === 'margin' || relV === 'topMargin' || relV === 'bottomMargin'){
        const avail = state.page.h - state.page.mT - state.page.mB;
        if (posV.align === 'center') y = state.page.mT + (avail - fi.image.heightPx)/2;
        else if (posV.align === 'bottom') y = state.page.mT + avail - fi.image.heightPx;
        else y = state.page.mT + posV.offset;
        isAbsY = true;
      } else {
        y = cur.cursorY + posV.offset;
        isAbsY = false;
      }

      const op = {
        op: 'image',
        x: x, y: y,
        w: fi.image.widthPx, h: fi.image.heightPx,
        dataUrl: fi.image.dataUrl,
        opacity: fi.image.opacity,
        rotation: fi.image.rotation,
        relativeHeight: fi.image.relativeHeight || 0,
        isAbsoluteX: isAbsX,
        isAbsoluteY: isAbsY
      };
      if (fi.image.behindDoc) cur.floatingBehind.push(op);
      else cur.floatingFront.push(op);
    }
  }

  if (block.isEmpty){
    const emptyStyle = Object.assign({}, state.docDefaults.run);
    const h = (emptyStyle.sizePx || 16) * lineHeightMultiplier;
    ensureSpace(h, false);
    let cur = getCurrent();
    cur.cursorY += h;
    spaceIfNeeded(spaceAfter, getCurrent, setCurrent, pages);
    return;
  }

  const tokens = []; 
  for (const item of block.runs){
    if (item.kind === 'text'){
      const parts = item.text.split(/(\s+)/).filter(s => s.length > 0);
      for (const part of parts){
        tokens.push({ text: part, style: item.style, isSpace: /^\s+$/.test(part) });
      }
    } else if (item.kind === 'tab'){
      tokens.push({ text: '\t', style: item.style, isTab: true });
    } else if (item.kind === 'lineBreak'){
      tokens.push({ forceBreak: true, style: item.style });
    } else if (item.kind === 'pageBreak'){
      tokens.push({ forceBreak: true, forcePage: true, style: item.style });
    } else if (item.kind === 'image'){
      tokens.push({ image: item.image, style: item.style });
    }
  }

  let firstLineOfPara = true;
  let lineTokens = [];
  let lineWidth = 0;

  function availableWidth(){
    const extra = firstLineOfPara ? Math.max(firstLineExtra,0) : 0;
    const hang = (!firstLineOfPara && firstLineExtra < 0) ? -firstLineExtra : 0;
    return contentWidth - indentLeft - indentRight - extra - (firstLineOfPara ? 0 : hang);
  }

  function flushLine(){
    if (lineTokens.length === 0 && firstLineOfPara === false) { }
    let maxTokenHeight = 0;
    for (const t of lineTokens){
      const h = t.image ? t.image.heightPx : (t.style.sizePx || 16) * lineHeightMultiplier;
      if (h > maxTokenHeight) maxTokenHeight = h;
    }
    if (maxTokenHeight === 0) maxTokenHeight = 16 * lineHeightMultiplier;

    ensureSpace(maxTokenHeight, false);
    let cur = getCurrent();

    const lineIndent = indentLeft + (firstLineOfPara ? Math.max(firstLineExtra,0) : (firstLineExtra < 0 ? -firstLineExtra : 0));
    const lineY = cur.cursorY;
    const lineAvailWidth = availableWidth();

    let trimmed = lineTokens.slice();
    while (trimmed.length && trimmed[trimmed.length-1].isSpace) trimmed.pop();

    let naturalWidth = 0;
    for (const t of trimmed){
      naturalWidth += tokenWidth(t);
    }

    let startX = contentLeft + lineIndent;
    let extraSpacePerGap = 0;
    if (para.align === 'center'){
      startX += Math.max(0,(lineAvailWidth - naturalWidth)/2);
    } else if (para.align === 'right'){
      startX += Math.max(0,(lineAvailWidth - naturalWidth));
    } else if (para.align === 'both' && !isLastLineOfParaFlag){
      const gaps = trimmed.filter(t=>t.isSpace).length;
      if (gaps > 0){
        extraSpacePerGap = Math.max(0,(lineAvailWidth - naturalWidth)) / gaps;
      }
    }

    if (listLabel && firstLineOfPara){
      const labelStyle = (block.runs[0] && block.runs[0].style) ? block.runs[0].style : state.docDefaults.run;
      cur.ops.push({
        op:'text', text: listLabel, x: contentLeft + Math.max(indentLeft - 22,0), y: lineY,
        style: labelStyle, baseline: maxTokenHeight
      });
    }

    let x = startX;
    for (const t of trimmed){
      if (t.image){
        cur.ops.push({ op:'image', x, y: lineY, w: t.image.widthPx, h: t.image.heightPx, dataUrl: t.image.dataUrl, opacity: t.image.opacity, rotation: t.image.rotation });
        x += t.image.widthPx;
        continue;
      }
      if (t.isTab){
        x += 36; 
        continue;
      }
      const w = tokenWidth(t);
      cur.ops.push({ op:'text', text: t.text, x, y: lineY, w, style: t.style, baseline: maxTokenHeight });
      x += w;
      if (t.isSpace) x += extraSpacePerGap;
    }

    cur.cursorY += maxTokenHeight;
    firstLineOfPara = false;
    lineTokens = [];
    lineWidth = 0;
  }

  let isLastLineOfParaFlag = false;

  function tokenWidth(t){
    if (t.image) return t.image.widthPx;
    if (t.isTab) return 36;
    ctx.font = fontString(t.style);
    return ctx.measureText(t.text).width;
  }

  for (let idx = 0; idx < tokens.length; idx++){
    const t = tokens[idx];
    if (t.forceBreak){
      flushLine();
      if (t.forcePage){
        const np = newPageLayout();
        pages.push(np);
        setCurrent(np);
      }
      continue;
    }
    const w = tokenWidth(t);
    const limit = availableWidth();
    if (lineWidth + w > limit && lineTokens.length > 0 && !t.isSpace){
      flushLine();
    }
    lineTokens.push(t);
    lineWidth += w;
  }
  isLastLineOfParaFlag = true;
  if (lineTokens.length > 0 || firstLineOfPara){
    flushLine();
  }

  spaceIfNeeded(spaceAfter, getCurrent, setCurrent, pages);
}

function spaceIfNeeded(amount, getCurrent, setCurrent, pages){
  if (!amount) return;
  let cur = getCurrent();
  cur.cursorY += amount;
}

async function layoutTable(tbl, contentLeft, contentWidth, pages, getCurrent, setCurrent, ensureSpace){
  const totalDefinedWidth = tbl.colWidths.reduce((a,b)=>a+b,0) || contentWidth;
  const scale = contentWidth / totalDefinedWidth;
  const colWidths = tbl.colWidths.length ? tbl.colWidths.map(w => w*scale) : [contentWidth];

  for (const row of tbl.rows){
    const cellRenders = [];
    let colIndex = 0;
    let rowHeight = 24;
    for (const cell of row.cells){
      const cellWidth = sumColWidths(colWidths, colIndex, cell.gridSpan);
      const cellPages = [ { w: cellWidth, h: 999999, ops: [], floatingBehind: [], floatingFront: [], cursorY: 4 } ];
      let curCellPage = cellPages[0];
      const cellEnsure = (needed) => { };
      for (const b of cell.blocks){
        if (b.type === 'paragraph'){
          await layoutParagraph(b, 0, cellWidth - 8, cellPages, () => curCellPage, (p)=>{curCellPage=p;}, cellEnsure);
        }
      }
      const h = Math.max(24, curCellPage.cursorY + 6);
      rowHeight = Math.max(rowHeight, h);
      cellRenders.push({ ops: curCellPage.ops, width: cellWidth, colIndex, gridSpan: cell.gridSpan });
      if (curCellPage.floatingBehind.length) getCurrent().floatingBehind.push(...curCellPage.floatingBehind);
      if (curCellPage.floatingFront.length) getCurrent().floatingFront.push(...curCellPage.floatingFront);
      colIndex += cell.gridSpan;
    }

    ensureSpace(rowHeight, false);
    let cur = getCurrent();
    const rowY = cur.cursorY;
    let x = contentLeft;
    colIndex = 0;
    for (const cr of cellRenders){
      const cellX = contentLeft + sumColWidths(colWidths, 0, cr.colIndex);
      cur.ops.push({ op:'rect', x: cellX, y: rowY, w: cr.width, h: rowHeight, stroke:'#000000', lineWidth: 1 });
      for (const o of cr.ops){
        const shifted = Object.assign({}, o, { x: o.x + cellX + 4, y: o.y + rowY });
        cur.ops.push(shifted);
      }
    }
    cur.cursorY += rowHeight;
  }
}
function sumColWidths(colWidths, from, span){
  let s = 0;
  for (let i=from; i<from+span && i<colWidths.length; i++) s += colWidths[i];
  return s;
}

/* =========================================================================
   7) RENDERIZADO EN CANVAS
   ========================================================================= */
async function preloadAllImages(){
  const dataUrls = new Set();
  for (const p of state.pages){
    for (const op of p.ops){ if (op.op === 'image') dataUrls.add(op.dataUrl); }
    for (const op of p.floatingBehind){ dataUrls.add(op.dataUrl); }
    for (const op of p.floatingFront){ dataUrls.add(op.dataUrl); }
  }
  for (const layoutMap of [state.headerLayout, state.footerLayout]){
    for (const type in layoutMap){
      const data = layoutMap[type];
      for (const op of data.ops){ if (op.op === 'image') dataUrls.add(op.dataUrl); }
      for (const op of data.floatingBehind){ dataUrls.add(op.dataUrl); }
      for (const op of data.floatingFront){ dataUrls.add(op.dataUrl); }
    }
  }
  await Promise.all(Array.from(dataUrls).map(preloadImage));
}

// Encabezado / pie que le corresponden a la página i (y dónde empieza el pie)
function pageLayers(i){
  const useFirst = (i === 0) && state.page.titlePg;
  const headerData = (useFirst && state.headerLayout.first) || state.headerLayout.default;
  const footerData = (useFirst && state.footerLayout.first) || state.footerLayout.default;
  let footerTopY = 0;
  if (footerData) footerTopY = state.page.h - state.page.footerDistPx - footerData.height;
  return { headerData, footerData, footerTopY };
}

// Dibuja TODO el contenido de una página (fondo flotante, encabezado, pie, cuerpo y primer plano).
// Lo comparten la vista en pantalla y la exportación a PDF, para que se vean idénticas.
function drawPageContent(page, i, offsetY){
  const { headerData, footerData, footerTopY } = pageLayers(i);

  drawFloatingLayer(sortByRelativeHeight(page.floatingBehind), offsetY);

  if (headerData){
    drawFloatingLayerShifted(sortByRelativeHeight(headerData.floatingBehind), state.page.mL, state.page.headerDistPx, offsetY);
    drawOpsShifted(headerData.ops, state.page.mL, state.page.headerDistPx, offsetY);
  }

  if (footerData){
    drawFloatingLayerShifted(sortByRelativeHeight(footerData.floatingBehind), state.page.mL, footerTopY, offsetY);
    drawOpsShifted(footerData.ops, state.page.mL, footerTopY, offsetY);
  }

  drawOps(page.ops, offsetY);

  if (headerData) drawFloatingLayerShifted(sortByRelativeHeight(headerData.floatingFront), state.page.mL, state.page.headerDistPx, offsetY);
  if (footerData) drawFloatingLayerShifted(sortByRelativeHeight(footerData.floatingFront), state.page.mL, footerTopY, offsetY);

  drawFloatingLayer(sortByRelativeHeight(page.floatingFront), offsetY);
}

async function renderAllPages(){
  const pagesData = state.pages;
  const zoom = state.zoom;

  await preloadAllImages();

  const pageW = state.page.w;
  const totalHeight = pagesData.reduce((acc,p) => acc + p.h + PAGE_GAP, 0);

  canvas.width = Math.round(pageW * zoom);
  canvas.height = Math.round((totalHeight) * zoom);
  canvas.style.width = Math.round(pageW * zoom) + 'px';
  canvas.style.height = Math.round(totalHeight * zoom) + 'px';

  ctx.setTransform(zoom, 0, 0, zoom, 0, 0);
  ctx.clearRect(0,0, canvas.width/zoom, canvas.height/zoom);

  let offsetY = 0;
  for (let i = 0; i < pagesData.length; i++){
    const page = pagesData[i];
    drawPageSheet(offsetY, pageW, page.h);
    drawPageContent(page, i, offsetY);
    offsetY += page.h + PAGE_GAP;
  }

  pageIndicator.textContent = `${pagesData.length} página${pagesData.length===1?'':'s'}`;
  if (typeof window.dvOnRendered === 'function'){ try { window.dvOnRendered(); } catch(e){ console.error(e); } }
}

/* ── EXPORTACIÓN (PDF): una página a la vez, en su propio canvas y a la resolución pedida ──
   `scale` = píxeles de salida por píxel de layout (ppp / 96). Por cada página dibuja de forma
   SÍNCRONA (así el canvas de la pantalla nunca se mezcla) y entrega el canvas + los textos con
   su posición, para que el PDF pueda llevar una capa de texto seleccionable. */
function collectPageTexts(page, i){
  const { headerData, footerData, footerTopY } = pageLayers(i);
  const out = [];
  const add = (ops, sx, sy) => ops.forEach(op => {
    if (op.op !== 'text' || !op.text || !op.text.trim()) return;
    const st = op.style || {};
    out.push({ x: op.x + sx, y: op.y + sy, w: op.w || 0, size: st.sizePx || 16, bold: !!st.bold, text: op.text });
  });
  add(page.ops, 0, 0);
  if (headerData) add(headerData.ops, state.page.mL, state.page.headerDistPx);
  if (footerData) add(footerData.ops, state.page.mL, footerTopY);
  out.sort((a, b) => (Math.round(a.y / 3) - Math.round(b.y / 3)) || (a.x - b.x));
  return out;
}
async function exportPages(scale, onPage){
  if (!state.pages.length) throw new Error('No hay un documento renderizado para exportar.');
  await preloadAllImages();
  const total = state.pages.length;
  for (let i = 0; i < total; i++){
    const page = state.pages[i];
    const off = document.createElement('canvas');
    off.width = Math.max(1, Math.round(state.page.w * scale));
    off.height = Math.max(1, Math.round(page.h * scale));
    const prev = ctx;
    try {
      ctx = off.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, off.width, off.height);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      drawPageContent(page, i, 0);
    } finally { ctx = prev; }
    await onPage(off, { w: state.page.w, h: page.h, texts: collectPageTexts(page, i) }, i, total);
  }
}

function sortByRelativeHeight(list){
  return list.slice().sort((a,b) => (a.relativeHeight||0) - (b.relativeHeight||0));
}

function drawFloatingLayerShifted(ops, shiftX, shiftY, offsetY){
  for (const op of ops){
    const img = state.images[op.dataUrl];
    if (img) {
      const finalX = op.isAbsoluteX ? op.x : op.x + shiftX;
      const finalY = op.isAbsoluteY ? op.y : op.y + shiftY;
      drawImageOp(Object.assign({}, op, { x: finalX, y: finalY }), offsetY, img);
    }
  }
}

function drawFloatingLayer(ops, offsetY){
  for (const op of ops){
    const img = state.images[op.dataUrl];
    if (img) drawImageOp(op, offsetY, img);
  }
}

function drawPageSheet(offsetY, w, h){
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.18)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, offsetY, w, h);
  ctx.restore();
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, offsetY + 0.5, w-1, h-1);
}

function drawOps(ops, offsetY){
  for (const op of ops){
    if (op.op === 'text'){
      drawText(op, offsetY);
    } else if (op.op === 'image'){
      const img = state.images[op.dataUrl];
      if (img) drawImageOp(op, offsetY, img);
    } else if (op.op === 'rect'){
      ctx.save();
      ctx.strokeStyle = op.stroke || '#000';
      ctx.lineWidth = op.lineWidth || 1;
      ctx.strokeRect(op.x + 0.5, offsetY + op.y + 0.5, op.w - 1, op.h - 1);
      ctx.restore();
    }
  }
}

function drawOpsShifted(ops, shiftX, shiftY, offsetY){
  const shiftedOps = ops.map(op => {
    return Object.assign({}, op, {
      x: op.x + shiftX,
      y: op.y + shiftY
    });
  });
  drawOps(shiftedOps, offsetY);
}

function drawImageOp(op, offsetY, img){
  ctx.save();
  if (typeof op.opacity === 'number' && op.opacity < 1){
    ctx.globalAlpha = op.opacity;
  }
  if (op.rotation){
    const cx = op.x + op.w / 2;
    const cy = offsetY + op.y + op.h / 2;
    ctx.translate(cx, cy);
    ctx.rotate(op.rotation);
    ctx.drawImage(img, -op.w / 2, -op.h / 2, op.w, op.h);
  } else {
    ctx.drawImage(img, op.x, offsetY + op.y, op.w, op.h);
  }
  ctx.restore();
}

function drawText(op, offsetY){
  const style = op.style || {};
  ctx.save();
  ctx.font = fontString(style);
  ctx.fillStyle = style.color || '#000000';
  ctx.textBaseline = 'alphabetic';
  const ascent = (style.sizePx || 16) * 0.8;
  const y = offsetY + op.y + ascent;
  let text = op.text;
  let xPos = op.x;
  if (style.vertAlign === 'superscript'){
    ctx.font = fontString(Object.assign({}, style, { sizePx: (style.sizePx||16)*0.7 }));
    ctx.fillText(text, xPos, y - (style.sizePx||16)*0.25);
  } else if (style.vertAlign === 'subscript'){
    ctx.font = fontString(Object.assign({}, style, { sizePx: (style.sizePx||16)*0.7 }));
    ctx.fillText(text, xPos, y + (style.sizePx||16)*0.15);
  } else {
    if (style.highlight){
      const w = ctx.measureText(text).width;
      ctx.save();
      ctx.fillStyle = highlightColor(style.highlight);
      ctx.fillRect(xPos, y - ascent, w, (style.sizePx||16)*1.2);
      ctx.restore();
      ctx.fillStyle = style.color || '#000000';
    }
    ctx.fillText(text, xPos, y);
    if (style.underline || style.strike){
      const w = ctx.measureText(text).width;
      ctx.strokeStyle = style.color || '#000000';
      ctx.lineWidth = Math.max(1, (style.sizePx||16)*0.06);
      ctx.beginPath();
      const lineY = style.strike ? y - (style.sizePx||16)*0.3 : y + 2;
      ctx.moveTo(xPos, lineY);
      ctx.lineTo(xPos + w, lineY);
      ctx.stroke();
    }
  }
  ctx.restore();
}
function highlightColor(name){
  const map = { yellow:'#fff59d', green:'#a5d6a7', cyan:'#80deea', magenta:'#f48fb1',
    blue:'#90caf9', red:'#ef9a9a', darkYellow:'#ffe082', darkGray:'#bdbdbd', lightGray:'#eeeeee' };
  return map[name] || '#fff59d';
}

/* =========================================================================
   8) CONTROLES DE ZOOM
   ========================================================================= */
function applyZoom(newZoom, refit){
  state.zoom = Math.min(3, Math.max(0.25, newZoom));
  zoomLabel.textContent = Math.round(state.zoom*100) + '%';
  if (state.pages.length){
    renderAllPages();
  }

function extractArray(src,name){
  const m=new RegExp('const\\s+'+name+'\\s*=\\s*\\[').exec(src);
  if(!m)return[];
  let i=m.index+m[0].length-1,d=0,q=null,s=i;
  for(;i<src.length;i++){
    const ch=src[i];
    if(q){if(ch==='\\')i++;else if(ch===q)q=null;continue}
    if(ch==='"'||ch==="'"||ch==='`')q=ch;
    else if(ch==='[')d++;
    else if(ch===']'&&--d===0)break;
  }
  try{return new Function('return '+src.slice(s,i+1))()}catch(e){return[]}
}
function parseCatalog(js){

      out.push({key:k+'-'+n,cat:k,sem:x.sem,name:x.name,desc:x.desc||'',url:x.url});
  }));
  return out;
}

/* ───── RESPALDO LOCAL: búsqueda directa en el catálogo ───── */
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const STOP=new Set('de del la el los las para que con por una uno quiero necesito dame muestrame archivo archivos semestre hay tienes tiene y en un me mi dime puedes algun alguna'.split(' '));
function localSearch(q){
  const n=norm(q);
  let sem=null;
  const sm=n.match(/(\d)\s*[°ºo]?\s*(?:sem|er|do|to|vo)/)||n.match(/semestre\s*(\d)/);
  if(sm)sem=+sm[1];
  else if(/segundo/.test(n))sem=2;else if(/tercer/.test(n))sem=3;else if(/cuarto/.test(n))sem=4;
  else if(/general/.test(n))sem=0;
  let cat=null;
  if(/membrete/.test(n))cat='membretes';
  else if(/instrument/.test(n))cat='instrumentaciones';
  else if(/programa|software|instalar|descargar app/.test(n))cat='programas';
  else if(/atribut|materia|indicador|objetivo|codigo|clase/.test(n))cat='materias';
  else if(/formato|portafolio|portada/.test(n))cat='formatos';
  const words=n.split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w)&&!/^\d/.test(w)).map(w=>w.length>4?w.replace(/(es|s)$/,''):w);
  const res=catalog.map(f=>{
    if(cat&&f.cat!==cat)return null;
    if(sem!==null&&f.sem!==sem)return null;
    const t=norm(f.name+' '+f.desc);
    const hits=words.filter(w=>t.includes(w)).length;
    return{f,s:hits*2+(cat?1:0)+(sem!==null?1:0)};
  }).filter(x=>x&&x.s>0&&(x.s>(cat?1:0)+(sem!==null?1:0)||!words.length));
  return res.sort((a,b)=>b.s-a.s).slice(0,8).map(x=>x.f);
}
