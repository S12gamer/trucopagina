/* ───── Núcleo de edición del .docx (tomado de tu generador) ───── */
function escXml(str) {
  return String(str || '').replace(/&/g, '&amp;')
                           .replace(/</g, '&lt;')
                           .replace(/>/g, '&gt;')
                           .replace(/"/g, '&quot;')
                           .replace(/'/g, '&apos;');
}

function insertarTextoEnXML(xml, textoXml) {
  const lastSectPrIdx = xml.lastIndexOf('<w:sectPr');
  
  // Eliminamos 'parrafoEspaciador' para evitar el tercer salto de línea innecesario.
  // Al insertar 'textoXml' directamente, se respeta el espacio nativo de la plantilla 
  // dejando exactamente dos espacios de separación bajo el cuadro.
  const totalAInsertar = textoXml;

  if (lastSectPrIdx !== -1) {
    return xml.slice(0, lastSectPrIdx) + totalAInsertar + xml.slice(lastSectPrIdx);
  } else {
    const bodyEndIdx = xml.lastIndexOf('</w:body>');
    if (bodyEndIdx !== -1) {
      return xml.slice(0, bodyEndIdx) + totalAInsertar + xml.slice(bodyEndIdx);
    }
  }
  return xml;
}

function aplicarSustitucionesXML(xml, opts) {
  xml = procesarFilasDeTabla(xml, opts);
  if(opts.materia_sel !== '__vacio__') xml = filtrarCompetencias(xml, opts);
  xml = filtrarIndicadores(xml, opts);
  return xml;
}

function procesarFilasDeTabla(xml, opts) {
  return xml.replace(/(<w:tr\b[\s\S]*?<\/w:tr>)/g, fila => {
    const celdas = [];
    const reCell = /<w:tc\b[\s\S]*?<\/w:tc>/g;
    let m;
    while((m = reCell.exec(fila)) !== null) celdas.push({ match: m[0], index: m.index });
    if(celdas.length < 2) return fila;

    let filaModificada = fila;

    for(let i = 0; i < celdas.length - 1; i++) {
      const txtEtiqueta = extraerTexto(celdas[i].match).toLowerCase().trim();
      let nuevoValor = null;

      if(/nombre.*alumno|nombre.*estudiante|^nombre$/i.test(txtEtiqueta)) nuevoValor = opts.nombre + ' ' + opts.control;
      else if(/no\.?\s*control|n[uú]mero.*control|control/i.test(txtEtiqueta)) nuevoValor = opts.nombre + ' ' + opts.control;
      else if(/divisi[oó]n|carrera|programa/i.test(txtEtiqueta)) nuevoValor = opts.division;
      else if(/grupo/i.test(txtEtiqueta)) nuevoValor = opts.grupo;
      else if(/fecha/i.test(txtEtiqueta)) nuevoValor = opts.fecha;
      else if(/asignatura|materia/i.test(txtEtiqueta)) nuevoValor = opts.materia;
      else if(/docente|profesor|maestro/i.test(txtEtiqueta)) nuevoValor = opts.docente;
      else if(/competencia.*no|no.*competencia|competencia\s*#|n[uú]m.*competencia/i.test(txtEtiqueta)) nuevoValor = opts.compNum;
      else if(/evidencia/i.test(txtEtiqueta)) nuevoValor = opts.evidencia;

      if(nuevoValor !== null) {
        const celdaValorOriginal = celdas[i + 1].match;
        const celdaValorNueva = escribirValorEnCelda(celdaValorOriginal, nuevoValor);
        filaModificada = filaModificada.replace(celdaValorOriginal, celdaValorNueva);
      }
    }
    return filaModificada;
  });
}

function escribirValorEnCelda(celda, valor) {
  const matchRpr = celda.match(/<w:rPr[\s\S]*?<\/w:rPr>/);
  const rPr = matchRpr ? matchRpr[0] : '';
  const matchPPr = celda.match(/<w:pPr[\s\S]*?<\/w:pPr>/);
  const pPr = matchPPr ? matchPPr[0] : '';
  const matchTcPr = celda.match(/<w:tcPr[\s\S]*?<\/w:tcPr>/);
  const tcPr = matchTcPr ? matchTcPr[0] : '';
  return `<w:tc>${tcPr}<w:p>${pPr}<w:r>${rPr}<w:t xml:space="preserve">${escXml(valor)}</w:t></w:r></w:p></w:tc>`;
}

function extraerTexto(xml) {
  return (xml.match(/<w:t[^>]*>([^<]*)<\/w:t>/g) || []).map(m => m.replace(/<[^>]+>/g,'')).join('');
}

function filtrarCompetencias(xml, opts) {
  const data = asignaturasData[opts.materia_sel];
  if(!data) return xml;

  const compElegida = String(opts.compNum);
  const todasComps  = data.competencias;

  xml = xml.replace(/(<w:tr\b[\s\S]*?<\/w:tr>)/g, fila => {
    const celdas = extraerCeldas(fila);
    if(celdas.length < 2) return fila;

    let filaModificada = fila;

    for(let i = 0; i < celdas.length - 1; i++) {
      const txtEtiq = extraerTexto(celdas[i]).toLowerCase().trim();
      const celdaValor = celdas[i + 1];

      if(/competencia.*no|no.*competencia|competencia\s*#|n[uú]m.*competencia/i.test(txtEtiq)) {
        const nueva = limpiarNumerosCompetencia(celdaValor, compElegida, data.total_comp);
        filaModificada = filaModificada.replace(celdaValor, nueva);
      }
      if(/descripci[oó]n/i.test(txtEtiq)) {
        const nueva = limpiarDescripcionesCompetencia(celdaValor, compElegida, todasComps);
        filaModificada = filaModificada.replace(celdaValor, nueva);
      }
    }
    return filaModificada;
  });
  return xml;
}

function extraerCeldas(fila) {
  const celdas = [];
  const re = /<w:tc\b[\s\S]*?<\/w:tc>/g;
  let m;
  while((m = re.exec(fila)) !== null) celdas.push(m[0]);
  return celdas;
}

function limpiarNumerosCompetencia(celda, compElegida, total) {
  const parrafos = extraerParrafos(celda);
  const mantenidos = parrafos.filter(p => {
    const txt = extraerTexto(p).trim();
    if(!txt) return false;
    return txt === compElegida || txt === compElegida + '.' || txt.startsWith(compElegida);
  });
  const resultado = mantenidos.length > 0 ? mantenidos : parrafos.filter(p => extraerTexto(p).trim().includes(compElegida));
  return reconstruirCelda(celda, resultado.length > 0 ? resultado : [crearParrafoTexto(celda, compElegida)]);
}

function limpiarDescripcionesCompetencia(celda, compElegida, todasComps) {
  const descElegida = todasComps[parseInt(compElegida) - 1];
  if(!descElegida) return celda;

  const parrafos = extraerParrafos(celda);
  const conTexto = parrafos.filter(p => extraerTexto(p).trim().length > 0);
  const numActual = parseInt(compElegida);
  const numSiguiente = numActual + 1;
  let guardar = false;
  const elegidos = [];
  const firmaActual = descElegida.toLowerCase().trim().substring(0, 20);
  const descSiguiente = todasComps[numSiguiente - 1];
  const firmaSiguiente = descSiguiente ? descSiguiente.toLowerCase().trim().substring(0, 20) : null;
  
  for (let i = 0; i < conTexto.length; i++) {
    const txtParagraph = extraerTexto(conTexto[i]).toLowerCase().trim();
    if (txtParagraph.includes(firmaActual) || firmaActual.includes(txtParagraph)) guardar = true;
    else if (firmaSiguiente && (txtParagraph.includes(firmaSiguiente) || firmaSiguiente.includes(txtParagraph))) guardar = false;
    if (guardar) elegidos.push(conTexto[i]);
  }
  const resultado = elegidos.length > 0 ? elegidos : [crearParrafoTexto(celda, descElegida)];
  return reconstruirCelda(celda, resultado);
}

function extraerParrafos(celda) { return celda.match(/<w:p\b[\s\S]*?<\/w:p>/g) || []; }

function reconstruirCelda(celdaOriginal, parrafosNuevos) {
  const matchTcPr = celdaOriginal.match(/<w:tcPr[\s\S]*?<\/w:tcPr>/);
  const tcPr = matchTcPr ? matchTcPr[0] : '';
  return `<w:tc>${tcPr}${parrafosNuevos.join('')}</w:tc>`;
}

function crearParrafoTexto(celdaRef, texto) {
  const matchRpr = celdaRef.match(/<w:rPr[\s\S]*?<\/w:rPr>/);
  const rPr = matchRpr ? matchRpr[0] : '';
  const matchPPr = celdaRef.match(/<w:pPr[\s\S]*?<\/w:pPr>/);
  const pPr = matchPPr ? matchPPr[0] : '';
  return `<w:p>${pPr}<w:r>${rPr}<w:t xml:space="preserve">${escXml(texto)}</w:t></w:r></w:p>`;
}

function filtrarIndicadores(xml, opts) {
  return xml.replace(/(<w:tr\b[\s\S]*?<\/w:tr>)/g, fila => {
    const celdas = extraerCeldas(fila);
    if(celdas.length < 2) return fila;

    let filaModificada = fila;
    for(let i = 0; i < celdas.length - 1; i++) {
      const txtEtiq = extraerTexto(celdas[i]).toLowerCase().trim();
      if(/indicador|desempe[nñ]o/i.test(txtEtiq)) {
        const celdaValor = celdas[i + 1];
        let parrafosNuevos = [];
        if(opts.indFull && opts.indFull.length > 0) {
          const ordenados = opts.indFull.slice().sort((a, b) => a.localeCompare(b));
          parrafosNuevos = ordenados.map(ind => crearParrafoTexto(celdaValor, ind));
        } else {
          parrafosNuevos = [crearParrafoTexto(celdaValor, '—')];
        }
        const nueva = reconstruirCelda(celdaValor, parrafosNuevos);
        filaModificada = filaModificada.replace(celdaValor, nueva);
      }
    }
    return filaModificada;
  });
}

function extraXml(t){

function cdaPrompt(sys){
  const MAX=19000;
  const turns=history.map(h=>{
    const t=h.parts.map(p=>p.text||'').join('');
    if(h.role==='user')return 'Usuario: '+t;
    let x=t;try{const j=JSON.parse(t);x=(j&&j.text)||t}catch(e){}
    return 'Synaps: '+x;
  });
  const head=sys.slice(0,14000)+'\n\nCONVERSACIÓN (la última línea es el mensaje actual del usuario):\n',tail='\n\nResponde ahora SOLO con el JSON indicado, sin texto extra.';
  let used=head.length+tail.length;const keep=[];
  for(let i=turns.length-1;i>=0;i--){const t=turns[i].slice(0,3000);if(used+t.length+1>MAX&&keep.length)break;keep.unshift(t);used+=t.length+1}
  return head+keep.join('\n')+tail;
}
async function revealText(text,onText){
  const parts=text.split(/(\s+)/),per=Math.max(8,Math.min(45,3500/Math.max(parts.length,1)));let out='';
  for(const w of parts){out+=w;onText(out);if(w.trim())await sleep(per)}
}

function convertirHtmlAWordXML(htmlContenido) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlContenido, 'text/html');
  let bodyXml = "";
  const bloques = doc.body.childNodes;
  
  const pPrDe = el => { const m = /ql-align-(center|right|justify)/.exec((el && el.className) || ''); return '<w:pPr><w:jc w:val="' + (m ? (m[1] === 'justify' ? 'both' : m[1]) : 'left') + '"/></w:pPr>'; };
  const pPrEstandar = pPrDe(null);
  let numLi = 0, oriActual = 'v';

  bloques.forEach(bloque => {
    if (bloque.nodeType === Node.ELEMENT_NODE) {
      if (bloque.nodeName === 'UL' || bloque.nodeName === 'OL') {
        numLi = 0;
        bloque.childNodes.forEach(li => {
          if (li.nodeType === Node.ELEMENT_NODE && li.nodeName === 'LI') {
            const ord = (li.getAttribute('data-list') || (bloque.nodeName === 'OL' ? 'ordered' : 'bullet')) === 'ordered';
            if (!ord) numLi = 0;
            bodyXml += "<w:p>" + pPrDe(li);
            bodyXml += '<w:r><w:rPr><w:rFonts w:ascii="Gotham Book" w:hAnsi="Gotham Book" w:cs="Gotham Book"/><w:b/></w:rPr><w:t xml:space="preserve">' + (ord ? (++numLi) + '. ' : '• ') + '</w:t></w:r>';
            bodyXml += procesarNodo(li, { bold: false, italic: false, underline: false, size: null });
            bodyXml += "</w:p>";
          }
        });
      } else if (/^\[\[(nueva-pagina|pagina-horizontal|pagina-vertical)\]\]$/.test((bloque.textContent || '').trim())) {
        const mk = (bloque.textContent || '').trim();
        const destino = mk === '[[pagina-horizontal]]' ? 'h' : (mk === '[[pagina-vertical]]' ? 'v' : oriActual);
        if (destino !== oriActual) {
          // salto de sección: lo cierra con la orientación actual; aplicarOrientaciones() completa el sectPr real
          bodyXml += '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/><w:sectPr><w:pgSz w:w="' + (oriActual === 'v' ? '1' : '3') + '" w:h="2"/></w:sectPr></w:pPr></w:p>';
          oriActual = destino;
        } else
        bodyXml += '<w:p><w:pPr><w:pageBreakBefore/><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/><w:jc w:val="left"/></w:pPr></w:p>';
      } else {
        bodyXml += "<w:p>" + pPrDe(bloque);
        bodyXml += procesarNodo(bloque, { bold: false, italic: false, underline: false, size: null });
        bodyXml += "</w:p>";
      }
    }
  });

  return bodyXml;
}

function hexDe(c) {
  const h = /^#([0-9a-f]{6})$/i.exec(c); if (h) return h[1].toUpperCase();
  const r = /rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i.exec(c);
  return r ? [r[1], r[2], r[3]].map(n => (+n).toString(16).padStart(2, '0')).join('').toUpperCase() : null;
}
function procesarNodo(nodo, formatoActual ) {
  let xmlResultado = "";
  let formato = { ...formatoActual };

  if (nodo.nodeName === 'STRONG' || nodo.nodeName === 'B') formato.bold = true;
  if (nodo.nodeName === 'EM' || nodo.nodeName === 'I') formato.italic = true;
  if (nodo.nodeName === 'U') formato.underline = true;
  if (nodo.nodeName === 'S' || nodo.nodeName === 'STRIKE') formato.strike = true;
  if (nodo.style && nodo.style.color) { const hc = hexDe(nodo.style.color); if (hc) formato.color = hc; }
  if (nodo.nodeName === 'H3') {
    formato.size = "36"; // Tamaño 16pt para el Word
    formato.bold = true; // Forzamos negrita para los subtítulos
  }
  if (nodo.nodeName === 'H1') {
    formato.size = "36"; // Tamaño 16pt para el Word
    formato.bold = true; // Forzamos negrita para los subtítulos
  }
  if (nodo.nodeName === 'H2') {
    formato.size = "36"; // Tamaño 16pt para el Word
    formato.bold = true; // Forzamos negrita para los subtítulos
  }
  
  if (nodo.classList && nodo.classList.contains('ql-size-small')) formato.size = "12"; 
  if (nodo.classList && nodo.classList.contains('ql-size-large')) formato.size = "18"; 
  if (nodo.classList && nodo.classList.contains('ql-size-huge'))  formato.size = "32"; 

  if (nodo.nodeName === 'BR') {
    return "<w:r><w:br/></w:r>";
  }

  if (nodo.nodeType === Node.TEXT_NODE) {
    const textoEscapado = nodo.nodeValue
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    if (textoEscapado.trim() === "" && nodo.nodeValue !== " ") return "";

    xmlResultado += "<w:r>";
    
    let rPr = "<w:rPr>";
    rPr += '<w:rFonts w:ascii="Gotham Book" w:hAnsi="Gotham Book" w:cs="Gotham Book"/>';
    if (formato.bold) rPr += "<w:b/>";
    if (formato.italic) rPr += "<w:i/>";
    if (formato.strike) rPr += "<w:strike/>";
    if (formato.color) rPr += `<w:color w:val="${formato.color}"/>`;
    if (formato.underline) rPr += '<w:u w:val="single"/>';
    if (formato.size) rPr += `<w:sz w:val="${formato.size}"/>`; 
    rPr += "</w:rPr>";
    
    xmlResultado += rPr;
    xmlResultado += `<w:t xml:space="preserve">${textoEscapado}</w:t>`;
    xmlResultado += "</w:r>";
  } else {
    nodo.childNodes.forEach(hijo => {
      xmlResultado += procesarNodo(hijo, formato);
    });
  }

  return xmlResultado;
}

  function aplicarOrientaciones(zip) {

const PDFW=(()=>{
  const PX_A_PT = 0.75;                 // 1 px de layout (96 ppp) = 0.75 pt
  const CALIDAD_JPEG = 0.92;

  /* ═══════════════ Escritor de PDF mínimo ═══════════════ */
  const enc = new TextEncoder();
  const ascii = s => enc.encode(s);
  const num = n => (Math.round(n * 100) / 100).toString();

  // Texto «WinAnsi» (la codificación de la fuente estándar Helvetica) con escapes de PDF
  const CP1252 = { 0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E, 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F };
  function cadenaPdf(texto) {
    const bytes = [];
    for (const ch of String(texto).normalize("NFC")) {
      const cp = ch.codePointAt(0);
      let b;
      if (cp === 0xA0) b = 0x20;
      else if (cp < 0x20) b = 0x20;
      else if (cp < 0x80 || (cp >= 0xA1 && cp <= 0xFF)) b = cp;
      else b = CP1252[cp] || 0x3F;
      if (b === 0x28 || b === 0x29 || b === 0x5C) bytes.push(0x5C);   // ( ) \
      bytes.push(b);
    }
    return Uint8Array.from(bytes);
  }
  // Cadena UTF-16BE en hexadecimal (para el título del documento, con acentos)
  function hexUtf16(texto) {
    let h = "FEFF";
    for (let i = 0; i < texto.length; i++) h += texto.charCodeAt(i).toString(16).padStart(4, "0");
    return "<" + h.toUpperCase() + ">";
  }

  // Mide con Arial (mismas métricas que Helvetica) para ajustar el ancho del texto invisible
  const medidor = document.createElement("canvas").getContext("2d");
  function anchoNatural(t) {
    medidor.font = `${t.bold ? "bold " : ""}${t.size}px Arial, Helvetica, "Liberation Sans", sans-serif`;
    return medidor.measureText(t.text).width;
  }

  function capaTexto(textos, hPt) {
    const partes = [];
    for (const t of textos) {
      if (!t.text || !t.text.trim()) continue;
      const natural = anchoNatural(t);
      let tz = natural > 0 && t.w > 0 ? (t.w / natural) * 100 : 100;
      tz = Math.max(20, Math.min(400, tz));
      const x = t.x * PX_A_PT, y = hPt - (t.y + t.size * 0.8) * PX_A_PT, size = Math.max(1, t.size * PX_A_PT);
      partes.push(ascii(`BT\n3 Tr\n/${t.bold ? "F2" : "F1"} ${num(size)} Tf\n${num(tz)} Tz\n1 0 0 1 ${num(x)} ${num(y)} Tm\n(`));
      partes.push(cadenaPdf(t.text));
      partes.push(ascii(") Tj\nET\n"));
    }
    return partes;
  }

  function unir(partes) {
    let n = 0; partes.forEach(p => { n += p.length; });
    const out = new Uint8Array(n); let o = 0;
    partes.forEach(p => { out.set(p, o); o += p.length; });
    return out;
  }

  /* páginas: [{ jpeg:Uint8Array, wPx, hPx, wPt, hPt, texts:[] }]  →  Uint8Array con el PDF */
  function construirPdf(paginas, titulo) {
    const chunks = [], offs = [];
    let largo = 0;
    const push = b => { chunks.push(b); largo += b.length; };
    const obj = (n, partes) => { offs[n] = largo; push(ascii(`${n} 0 obj\n`)); partes.forEach(push); push(ascii("\nendobj\n")); };

    push(ascii("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"));
    const total = 5 + paginas.length * 3;
    const kids = paginas.map((_, i) => `${6 + i * 3} 0 R`).join(" ");
    const ahora = new Date(), p2 = n => String(n).padStart(2, "0");
    const fecha = `D:${ahora.getFullYear()}${p2(ahora.getMonth() + 1)}${p2(ahora.getDate())}${p2(ahora.getHours())}${p2(ahora.getMinutes())}${p2(ahora.getSeconds())}`;

    obj(1, [ascii("<< /Type /Catalog /Pages 2 0 R >>")]);
    obj(2, [ascii(`<< /Type /Pages /Kids [${kids}] /Count ${paginas.length} >>`)]);
    obj(3, [ascii("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>")]);
    obj(4, [ascii("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>")]);
    obj(5, [ascii(`<< /Title ${hexUtf16(titulo)} /Producer (Generador de Formatos) /CreationDate (${fecha}) >>`)]);

    paginas.forEach((p, i) => {
      const nPag = 6 + i * 3, nCont = nPag + 1, nImg = nPag + 2;
      obj(nPag, [ascii(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${num(p.wPt)} ${num(p.hPt)}] /Resources << /XObject << /Im0 ${nImg} 0 R >> /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${nCont} 0 R >>`)]);
      const contenido = unir([ascii(`q\n${num(p.wPt)} 0 0 ${num(p.hPt)} 0 0 cm\n/Im0 Do\nQ\n`), ...capaTexto(p.texts, p.hPt)]);
      obj(nCont, [ascii(`<< /Length ${contenido.length} >>\nstream\n`), contenido, ascii("\nendstream")]);
      obj(nImg, [ascii(`<< /Type /XObject /Subtype /Image /Width ${p.wPx} /Height ${p.hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`), p.jpeg, ascii("\nendstream")]);
    });

    const xref = largo;
    let tabla = `xref\n0 ${total + 1}\n0000000000 65535 f \n`;
    for (let n = 1; n <= total; n++) tabla += String(offs[n]).padStart(10, "0") + " 00000 n \n";
    push(ascii(tabla + `trailer\n<< /Size ${total + 1} /Root 1 0 R /Info 5 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
    return unir(chunks);
  }

  const canvasAJpeg = cv => new Promise((ok, fail) => cv.toBlob(async b => {
    if (!b) return fail(new Error("el navegador no pudo codificar la página (¿demasiado grande?)"));
    ok(new Uint8Array(await b.arrayBuffer()));
  }, "image/jpeg", CALIDAD_JPEG));
return{construirPdf,canvasAJpeg};
})();

/* ───── IMÁGENES (se guardan reducidas en IndexedDB; en la biblioteca solo su configuración) ───── */
const MAX_IMGS=20,MAX_PX=1600;
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('fo205imgs',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function idbOp(mode,fn){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction('i',mode),q=fn(t.objectStore('i'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})}
const idbPut=(id,v)=>idbOp('readwrite',s=>s.put(v,id)).catch(()=>{});
const idbGet=id=>idbOp('readonly',s=>s.get(id)).catch(()=>null);

function loadImg(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error('no se pudo leer la imagen'))};i.src=u})}
async function procImg(f){
  const im=await loadImg(f);let w=im.naturalWidth,h=im.naturalHeight;if(!w||!h)throw new Error('imagen sin dimensiones');
  const k=Math.min(1,MAX_PX/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
  const jpg=f.type==='image/jpeg';if(jpg){cx.fillStyle='#fff';cx.fillRect(0,0,w,h)}
  cx.drawImage(im,0,0,w,h);
  const b=await new Promise(r=>cv.toBlob(r,jpg?'image/jpeg':'image/png',.88));if(!b)throw new Error('no se pudo convertir');
  return{name:(f.name&&f.name!=='image.png'?f.name:'captura_'+Date.now()+'.png'),ext:jpg?'jpeg':'png',mime:jpg?'image/jpeg':'image/png',bytes:new Uint8Array(await b.arrayBuffer()),w,h,pct:60,al:'center',cap:'',after:null};
}

function textoXml(d){return d.html?convertirHtmlAWordXML(d.html):(d.extra&&d.extra.trim()?extraXml(d.extra):'')}
function unitsOf(d){

function conImagenes(zip,xml,ex,imgs){
  const units=ex?(ex.match(/<w:p[ >][\s\S]*?<\/w:p>/g)||[]):[],ok=!!ex&&units.join('')===ex;
  const key=it=>(ok&&it.after!=null&&it.after<units.length)?it.after:1e9;
  const ord=imgs.map((it,k)=>({it,k})).sort((a,b)=>key(a.it)-key(b.it)||a.k-b.k);
  const ctF=zip.file('[Content_Types].xml');
  if(ctF){let ct=ctF.asText(),add='';[...new Set(imgs.map(x=>x.ext))].forEach(e=>{if(!new RegExp('Extension="'+e+'"','i').test(ct))add+=`<Default Extension="${e}" ContentType="${e==='png'?'image/png':'image/jpeg'}"/>`});if(add)zip.file('[Content_Types].xml',ct.replace(/(<Types\b[^>]*>)/,'$1'+add))}
  const relF=zip.file('word/_rels/document.xml.rels');if(!relF)return ex;
  const area=areaUtil(xml),ix=[];let nr='',n=0;
  ord.forEach(({it,k})=>{
    const rid='rIdTMImg'+(k+1),ruta='media/tm_img'+(k+1)+'.'+it.ext;
    zip.file('word/'+ruta,it.bytes,{binary:true});
    nr+=`<Relationship Id="${rid}" Type="${NS_R}/image" Target="${ruta}"/>`;
    const pie=(it.cap||'').trim();
    let b=parrafoImagen(it,k+1,rid,area,!!pie,'');
    if(pie){n++;b+=parrafoPie('Figura '+n+'. '+pie,it.al,'')}
    ix[k]=b;
  });
  zip.file('word/_rels/document.xml.rels',relF.asText().replace('</Relationships>',nr+'</Relationships>'));
  if(!ok)return ex+imgs.map((_,k)=>ix[k]).join('');
  let res='';
  units.forEach((u,i)=>{res+=u;ord.forEach(({it,k})=>{if(key(it)===i)res+=ix[k]})});
  ord.forEach(({it,k})=>{if(key(it)===1e9)res+=ix[k]});
  return res;
}

function parseInd(q){
  const m=/indicador(?:es)?\s*[:\-]?\s*(.*)/i.exec(q);if(!m)return[];
  const T=m[1].split(/[\s,;]+/).map(t=>t.toLowerCase().replace(/[.)]+$/,'')).filter(Boolean),out=[];let rng=false;
  for(let i=0;i<T.length;i++){
    const x=T[i],nx=T[i+1]==='la'?T[i+2]:T[i+1];
    if((x==='a'||x==='hasta'||x==='-')&&out.length&&/^[a-f]$/.test(nx||'')){rng=true;continue}
    if(/^[a-f]$/.test(x)){
      const L=x.toUpperCase();
      if(rng&&out.length){for(let c=out[out.length-1].charCodeAt(0)+1;c<=L.charCodeAt(0);c++)out.push(String.fromCharCode(c))}
      else if(!out.includes(L))out.push(L);
      rng=false;
    }else if(!['y','e','la','el','de','del','los','las','letra','letras','desde'].includes(x))break;
  }
  return[...new Set(out)].sort();
}

}

  document.body.appendChild(d);
  const inp=d.querySelector('input');if(inp){inp.focus();inp.select()}else d.querySelector('[data-d="1"]').focus();
  const val=y=>y?(o.input?inp.value:true):(o.input?null:false);
  const done=v=>{d.remove();document.removeEventListener('keydown',kd,true);res(v)};
  const kd=e=>{if(e.key==='Escape'){e.stopPropagation();done(val(false))}else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();done(val(true))}};
  document.addEventListener('keydown',kd,true);
  d.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b)done(val(b.dataset.d==='1'));else if(e.target===d)done(val(false))});
})}

let pvTok=0;
function hidePv(){pvTok++;$('pv').hidden=true;$('pvb').innerHTML='';$('pva').innerHTML=''}
async function previewDoc(btn){
  let who=null;
  if(!btn.dataset.lib){
    who=whoFor(docs[btn.dataset.doc]);
    if(who.err==='profile'){pending=btn;add(profileCard(),'bot');return}
    if(who.err==='team'){toast('Estás en modo equipo pero no hay equipo elegido o integrantes marcados.');return}
  }
  const tok=++pvTok;closeMenu();
  $('pv').hidden=false;$('pvt').textContent='Vista previa';
  const a=btn.dataset.lib?`data-lib="${esc(btn.dataset.lib)}"`:`data-doc="${esc(btn.dataset.doc)}"`;
  $('pva').innerHTML=`<button type="button" class="dl c-blue" ${a}><span>Descargar</span></button><button type="button" class="dl c-rust" ${a} data-fmt="pdf"><span>PDF</span></button>`;
  $('pvb').innerHTML='<div class="pvl"><div class="typing"><i></i><i></i><i></i></div><span id="pvs">Preparando el documento…</span></div>';
  try{
    const dd=await docFor(btn);if(who)dd.whoP=who.p;
    $('pvt').textContent=dd.evidencia||'Formato de evidencia';
    const keep=dd.noSave;dd.noSave=true;let out;
    try{out=await buildDocx(dd)}finally{dd.noSave=keep}
    if(tok!==pvTok)return;
    const pages=await withEngine(async()=>{
      await DocxViewerEngine.loadBlob(out.blob,'vista_previa.docx');
      if(!DocxViewerEngine.getLayout().pages.length)throw new Error('no se pudo maquetar el documento');
      const arr=[];
      await DocxViewerEngine.exportPages(1.4,async(cv,meta,i,total)=>{
        arr.push(cv.toDataURL('image/jpeg',.85));
        const t=$('pvs');if(t)t.textContent='Página '+(i+1)+' de '+total;
        cv.width=cv.height=0;await new Promise(r=>setTimeout(r,0));
      });
      return arr;
    });
    if(tok!==pvTok)return;
    $('pvb').innerHTML=pages.map((u,i)=>`<figure class="pg"><img src="${u}" alt="Página ${i+1}"><figcaption>Página ${i+1} de ${pages.length}</figcaption></figure>`).join('');
  }catch(e){if(tok===pvTok)$('pvb').innerHTML='<div class="err">No se pudo generar la vista previa: '+esc(e.message)+'</div>'}
}

  const ib=e.target.closest('[data-img]');if(ib)return openImp(ib);
  const ix=e.target.closest('[data-imgdel]');if(ix){const p=ix.closest('.imp');docs[p.dataset.i].imgs.splice(+ix.dataset.imgdel,1);return renderImp(p)}
  const cp=e.target.closest('[data-copy]');if(cp){const el=cp.closest('.msg'),m=msgs[+el.dataset.mi];navigator.clipboard.writeText((m&&m.text)||'').then(()=>toast('Copiado'),()=>toast('No se pudo copiar'));return}
  const rt=e.target.closest('[data-retry]');if(rt)return retryLast(rt.closest('.msg'));
  const wc=e.target.closest('[data-w]');if(wc)return send(wc.dataset.w);
  const b=e.target.closest('[data-doc],[data-lib]');if(b)return runDoc(b);
  const x=e.target.closest('[data-del]');if(x){idbDel(x.dataset.del);localStorage.setItem(LIB,JSON.stringify(libGet().filter(r=>r.id!==x.dataset.del)));libCount();return renderLib()}
  const q=e.target.closest('[data-ask]');if(q){q.parentNode.remove();return send(q.dataset.ask)}
  const s=e.target.closest('[data-save]');if(!s)return;
  const box=s.closest('.prof'),p={};box.querySelectorAll('input').forEach(i=>p[i.dataset.k]=i.value.trim());
  if(!p.nombre||!p.control||!p.division||!p.grupo){s.textContent='Completa los 4 datos';return}
  localStorage.setItem('fo205',JSON.stringify(p));
  box.outerHTML='<div class="msg bot">Datos guardados.</div>';updateUser();
  if(pending){const b=pending;pending=null;runDoc(b)}
};
$('wrap').addEventListener('click',act);$('libview').addEventListener('click',act);$('pv').addEventListener('click',act);
$('wrap').addEventListener('change',async e=>{
  const p=e.target.closest('.imp');if(!p)return;const d=docs[p.dataset.i];
  if(e.target.type==='file'){await addImgs(d,e.target.files);e.target.value='';return renderImp(p)}
  const r=e.target.closest('[data-k]'),it=r&&d.imgs[r.dataset.k],f=e.target.dataset.f;if(!it)return;
  if(f==='pct')it.pct=+e.target.value;else if(f==='al')it.al=e.target.value;else if(f==='after')it.after=e.target.value===''?null:+e.target.value;
});
$('wrap').addEventListener('input',e=>{const p=e.target.closest('.imp'),r=e.target.closest('[data-k]');if(p&&r&&e.target.dataset.f==='cap')docs[p.dataset.i].imgs[r.dataset.k].cap=e.target.value});
document.addEventListener('paste',async e=>{
  const f=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(x=>/^image\//.test(x.type));
  if(!f.length||!impOpen||impOpen.hidden||!document.body.contains(impOpen))return;
  e.preventDefault();await addImgs(docs[impOpen.dataset.i],f);renderImp(impOpen);
});
$('wrap').addEventListener('dragover',e=>{if(e.target.closest('.imp'))e.preventDefault()});
$('wrap').addEventListener('drop',async e=>{const p=e.target.closest('.imp');if(!p)return;e.preventDefault();await addImgs(docs[p.dataset.i],e.dataTransfer.files);renderImp(p)});

renderModelSel();
Object.keys(PROV).filter(p=>p!=='synaps'&&p!=='cda'&&getKey(p)).forEach(p=>refreshModels(p).then(()=>{renderModelSel();renderGm()}));
$('teamview').addEventListener('click',teamClick);$('teamview').addEventListener('change',teamChange);
$('lq').oninput=renderLib;libCount();
$('lib').onclick=$('lback').onclick=()=>toggleView('lib');
$('team').onclick=$('tback').onclick=()=>toggleView('team');
$('menu').onclick=toggleSide;$('sideclose').onclick=closeDrawer;$('scrim').onclick=closeDrawer;
$('newm').onclick=$('clear').onclick=newChat;
$('hmore').onclick=e=>{if(curId)chatMenu(e.currentTarget,curId)};
$('umenu').onclick=e=>userMenu(e.currentTarget);
$('mbtn').onclick=e=>openModelMenu(e.currentTarget);
$('pvx').onclick=hidePv;
$('recents').addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o)return openChat(o.dataset.open);
  const m=e.target.closest('[data-rmore]');if(m)chatMenu(m,m.dataset.rmore);
});
let swx=0;
$('side').addEventListener('touchstart',e=>{swx=e.touches[0].clientX},{passive:true});
$('side').addEventListener('touchend',e=>{if(isMob()&&swx-e.changedTouches[0].clientX>70)closeDrawer()},{passive:true});
$('modal').addEventListener('click',e=>{
  if(e.target===$('modal')||e.target.closest('[data-mclose]'))return closeSettings();
  const t=e.target.closest('[data-mtab]');if(t){stab=t.dataset.mtab;return renderPane()}
  const ap=e.target.closest('[data-askpos]');if(ap){localStorage.setItem('ask_pos',ap.dataset.askpos);return renderPane()}
  if(e.target.closest('[data-psave]'))return savePerfil();
  if(e.target.closest('#reload'))return loadCatalog();
  if(e.target.closest('#reloadm'))return loadAsig();
  if(e.target.closest('#offprep')){toast('Guardando lo necesario para trabajar sin conexión…');loadCatalog();loadAsig();return prepareOffline().then(r=>{renderOffline();toast(r.every(x=>x[1])?'Todo quedó guardado en este dispositivo':'Quedó guardado lo que estaba disponible')})}
  keysClick(e);
});
$('modal').addEventListener('change',e=>{
  if(e.target.id==='wk')localStorage.setItem('use_worker',e.target.checked?'1':'0');
  if(e.target.id==='gm'){localStorage.setItem('gmodel',e.target.value);if(getKey('gemini')){localStorage.setItem('sel_model','gemini::'+e.target.value);renderModelSel()}}
});
$('form').addEventListener('submit',e=>{e.preventDefault();if(e.submitter&&e.submitter.id!=='send')return;send($('input').value)});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();send($('input').value)}});
$('input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px'});
if(localStorage.getItem('side_c')==='1'&&!isMob())document.body.classList.add('side-collapsed');
(()=>{
  const ban=$('pwa-install-banner'),upd=$('pwa-update-banner'),KEY='pwa_install_dismissed',btn=$('pwa-install-btn'),texto=ban.querySelector('p');
  const rechazado=()=>{try{return localStorage.getItem(KEY)==='1'}catch(e){return false}};
  addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();installEvt=e;
    if(!rechazado()&&!instalada()){btn.hidden=false;texto.textContent='Instala Synaps en tu dispositivo y úsalo sin conexión.';ban.classList.add('show')}
  });
  btn.onclick=()=>{ban.classList.remove('show');promptInstall()};
  $('pwa-dismiss-btn').onclick=()=>{ban.classList.remove('show');try{localStorage.setItem(KEY,'1')}catch(e){}};
  addEventListener('appinstalled',()=>{installEvt=null;ban.classList.remove('show')});
  if(esIOS()&&!instalada()&&!rechazado())setTimeout(showIOSHint,4000);
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    let yaControlada=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(yaControlada)upd.classList.add('show');yaControlada=true});
    addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(reg=>{
      setInterval(()=>reg.update().catch(()=>{}),3600000);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
    }).catch(e=>console.warn('SW no registrado:',e)));
    $('pwa-update-btn').onclick=()=>location.reload();
    $('pwa-update-x').onclick=()=>upd.classList.remove('show');
  }
})();
addEventListener('online',()=>{setLocal(false);loadCatalog();loadAsig();prepareOffline().then(()=>renderOffline())});
addEventListener('offline',()=>setLocal(true));
if(navigator.onLine===false)setLocal(true);
ensureLibs();
setTimeout(()=>{if(navigator.onLine!==false)prepareOffline()},2500);
welcome();loadCatalog();loadAsig();renderRecents();setTitle();updateUser();
(()=>{const q=new URLSearchParams(location.search).get('accion');if(!q)return;try{window.history.replaceState(null,'',location.pathname)}catch(e){}if(q==='documentos')toggleView('lib');else if(q==='equipos')toggleView('team')})();
</script>
